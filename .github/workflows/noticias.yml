# Recoge titulares públicos cada hora y los publica en la rama `news` (news.json), junto con los tipos de interés
# de las hipotecas (rates.json, de FRED). La app los lee de https://raw.githubusercontent.com/Marcos86GO/MyFinZen/news/.
# La rama `news` se reescribe en cada ejecución (un solo commit) para no engordar el repositorio.
name: Noticias

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['news/**', '.github/workflows/noticias.yml']

permissions:
  contents: read

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # solo para reescribir la rama news
    steps:
      # Acciones fijadas por su commit (no por etiqueta) para que nadie pueda cambiar su código por debajo
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Noticias anteriores
        run: |
          if git fetch -q --depth 1 origin news 2>/dev/null; then git show FETCH_HEAD:news.json > prev.json; git show FETCH_HEAD:rates.json > prev-rates.json 2>/dev/null || echo '{}' > prev-rates.json; else echo '{}' > prev.json; echo '{}' > prev-rates.json; fi

      - name: Recoger titulares
        run: node news/build.mjs out/news.json prev.json

      - name: Tipos de interés de hipotecas
        run: node news/rates.mjs out/rates.json prev-rates.json

      - name: Publicar en la rama news
        run: |
          cd out
          git init -q -b news
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json rates.json
          git commit -qm "Noticias $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" news
