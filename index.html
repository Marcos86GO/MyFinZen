}
function kidRow(c,i){ return `<div class="row kid" style="align-items:flex-end;margin-bottom:6px"><label class="f">Año de nacimiento<input class="kBY" inputmode="numeric" value="${c.by||''}" placeholder="2021"></label><label class="f" style="display:flex;gap:6px;align-items:center"><input type="checkbox" class="kSSN" style="width:auto" ${c.ssn!==false?'checked':''}> Tiene SSN</label><label class="f" style="display:flex;gap:6px;align-items:center"><input type="checkbox" class="kHome" style="width:auto" ${c.home!==false?'checked':''}> Vive con vosotros</label><button class="sm dan" data-delkid="${i}" style="margin-bottom:8px">✕</button></div>`; }

/* ---------- Optimizador ---------- */
function savingsOf(year,adj){ const a=computeTaxes(year), b=computeTaxes(year,adj); const fed=a.totalTax-b.totalTax; const ca=(adj.caDelta||0)*caMarginal(year,a.fs,Math.max(0,a.agi-Math.max(a.caStd,a.caItem))); return {fed,ca,total:fed+ca}; }
function recommendations(year){
  const ty=taxYear(year); const P=prof(year); const L=LIM[year]||LIM[2026]; const R=computeTaxes(year); const K=kidsSplit(year); const out=[];
  const now=new Date(); const yearOpen=now.getFullYear()<=year; const nextApr=`15 de abril de ${year+1}`;
  const add=(o)=>out.push(Object.assign({save:0,kind:'ahorro'},o));
  // 1. 401(k)
  const k401=R.k401||0;
  if(k401<L.k401){ const gap=L.k401-k401; const s=savingsOf(year,{k401:gap,caDelta:gap});
    add({t:`Aporta ${fmt(gap)} más al 401(k)`,save:s.total,when:yearOpen?`Antes del último pago de nómina de ${year}`:`Ya no se puede para ${year}; hazlo en ${year+1}`,
      d:`Llevas ${fmt(k401)} de un máximo de ${fmt(L.k401)}. Cada dólar pre-tax baja tu impuesto federal (${Math.round(R.marginal*100)}%) y el de California.${yearOpen?' Sube el % de aportación en el portal de nóminas para lo que queda de año.':''}`,
      tt:'Sale automáticamente del W-2 (casilla 12, código D). No tienes que hacer nada en TurboTax.',act:yearOpen}); }
  // 2. Spousal IRA
  const magi=R.agi; const spouseNoPlan=P.spouseCovered===false||P.spouseWorks===false;
  if(ty.filing!=='S'){
    const frac=P.covered===false&&spouseNoPlan?1:phaseFrac(magi,spouseNoPlan?L.iraSpouse:L.iraCov);
    const already=P.iraSpouse||0;
    if(frac>0&&already<L.ira){ const amt=Math.round((L.ira-already)*frac/10)*10; const s=savingsOf(year,{ira:amt,caDelta:amt});
      add({t:`IRA tradicional a nombre de tu cónyuge: ${fmt(amt)} deducibles`,save:s.total,when:`Hasta el ${nextApr}`,
        d:`Aunque ${P.spouseWorks===false?'no trabaje':'no tenga plan en el trabajo'}, como declaráis juntos puede aportar con tu sueldo (spousal IRA). Con un ingreso de ${fmtK(magi)} ${frac<1?`es deducible en parte (${Math.round(frac*100)}%)`:'es totalmente deducible'}; el límite de ingresos es ${fmtK(L.iraSpouse[0])}–${fmtK(L.iraSpouse[1])}. Ábrela en M1 u otro bróker y marca el año ${year} al aportar.`,
        tt:'Deductions & Credits → Retirement and Investments → Traditional and Roth IRA Contributions → indica que la IRA es de tu cónyuge y la cantidad.',act:true}); }
    else if(frac===0&&magi<L.roth[1]) add({t:'Roth IRA para los dos',save:0,kind:'futuro',when:`Hasta el ${nextApr}`,d:`Con tu nivel de ingresos la IRA tradicional ya no se deduce, pero podéis aportar hasta ${fmt(L.ira)} cada uno a una Roth IRA. No ahorra impuestos hoy, pero todo lo que crezca saldrá libre de impuestos en la jubilación.`,tt:'Deductions & Credits → Traditional and Roth IRA Contributions → elige Roth.'});
    else if(magi>=L.roth[1]) add({t:'"Backdoor" Roth IRA',save:0,kind:'futuro',when:`Hasta el ${nextApr}`,d:'Por ingresos no podéis aportar directamente a una Roth. Se puede aportar a una IRA tradicional no deducible y convertirla a Roth (Form 8606). Conviene hacerlo con un profesional si ya tenéis dinero en IRAs tradicionales.',tt:'Retirement and Investments → IRA contributions (no deducible) y luego Retirement Plans and Social Security → 1099-R de la conversión.'});
    // own IRA
    if(P.covered!==false){ const f2=phaseFrac(magi,L.iraCov); if(f2>0&&(P.iraYou||0)<L.ira){ const amt=Math.round((L.ira-(P.iraYou||0))*f2/10)*10; const s=savingsOf(year,{ira:amt,caDelta:amt}); add({t:`IRA tradicional a tu nombre: ${fmt(amt)} deducibles`,save:s.total,when:`Hasta el ${nextApr}`,d:`Con ingresos por debajo de ${fmtK(L.iraCov[1])} todavía puedes deducir tu propia IRA aunque tengas 401(k).`,tt:'Deductions & Credits → Traditional and Roth IRA Contributions.',act:true}); } }
  }
  // 3. HSA
  if(P.hdhp===true){ const gap=L.hsaFam-(P.hsa||0); if(gap>0){ const s=savingsOf(year,{hsa:gap,caDelta:0}); add({t:`Aporta ${fmt(gap)} más a la HSA`,save:s.total,when:`Hasta el ${nextApr} (mejor por nómina: también ahorras FICA)`,d:`Con un seguro HDHP familiar podéis aportar ${fmt(L.hsaFam)} al año. Desgrava en la federal (California no la reconoce) y el dinero se usa libre de impuestos en gastos médicos, o se invierte para el futuro.`,tt:'Deductions & Credits → Medical → HSA, MSA Contributions (Form 8889). Las aportaciones por nómina salen en el W-2 casilla 12 código W.',act:true}); } }
  else if(P.hdhp===undefined) add({t:'Comprueba si tu seguro es HDHP',save:0,kind:'revisar',when:'En la inscripción de beneficios (open enrollment)',d:`Si lo es, podéis meter hasta ${fmt(L.hsaFam)} al año en una HSA, el ahorro con más ventajas fiscales que existe. Si no lo es, en la inscripción de beneficios puedes comparar si te compensa cambiar.`,tt:''});
  // 4. Dependent care
  if(K.u13>0){
    if(P.spouseWorks===false) add({t:'Guardería: FSA y crédito no aplican este año',save:0,kind:'info',when:'',d:`Tanto la Dependent Care FSA (hasta ${fmt(L.dcfsa)}) como el crédito por cuidado de hijos exigen que trabajen los dos cónyuges, o que uno sea estudiante a tiempo completo. Si tu cónyuge vuelve a trabajar o a estudiar, merece mucho la pena activarlo.`,tt:''});
    else if(P.spouseWorks===true&&(P.childcare||0)>0){ const amt=Math.min(L.dcfsa,P.childcare); const s=savingsOf(year,{k401:amt,caDelta:amt}); add({t:`Dependent Care FSA: ${fmt(amt)}`,save:s.total+amt*0.0765,when:'Elígelo en la inscripción de beneficios para el año siguiente',d:'Pagas la guardería con dinero sin impuestos (federal, California y FICA). Lo que no cubra la FSA puede ir al crédito por cuidado de hijos.',tt:'Deductions & Credits → You and Your Family → Child and Dependent Care Credit (Form 2441). Necesitas el nombre, la dirección y el EIN del centro.',act:true}); }
  }
  // 5. Child tax credit check
  if(K.u17>0) add({t:`Crédito por hijos: ${K.u17} × $2,200`,save:0,kind:'ok',when:'',d:`Ya incluido en el cálculo (${fmt(R.ctc)}). Requisitos: cada hijo con SSN, menor de 17 a 31 de diciembre y viviendo con vosotros más de medio año.${K.o17?` Por los mayores de 17 hay un crédito de $500 cada uno.`:''}`,tt:'Se aplica solo al añadir a los hijos como dependientes en Personal Info → Dependents.'});
  // 6. Trump account
  if(K.trump.length&&!P.f4547) add({t:`Reclama $1,000 para ${K.trump.length>1?K.trump.length+' de tus hijos':'tu hijo nacido en '+K.trump[0].by} (Trump Account)`,save:1000*K.trump.length,kind:'dinero',when:'Con la declaración, o cuanto antes si no lo hiciste en la de 2025',
    d:'El gobierno deposita $1,000 en una cuenta de inversión para cada niño ciudadano con SSN nacido entre 2025 y 2028. No es automático: hay que pedirlo con el Form 4547. No es un ahorro de impuestos, pero es dinero para el niño.',tt:'Busca "Trump Account" o "Form 4547" en la lupa de TurboTax y marca la casilla del pilot program contribution (línea 7) para cada niño.',act:true});
  // 7. Property tax prepay
  if(R.useItem&&R.saltRaw<R.saltCap&&yearOpen){ const half=(P.homePropTax||R.homePT||0)/2; if(half>500){ const room=Math.min(half,R.saltCap-R.saltRaw); const s=savingsOf(year,{propTax:room,caDelta:room}); add({t:`Paga en diciembre la 2ª cuota del impuesto de propiedad (${fmt(room)})`,save:s.total,kind:'adelantar',when:`Antes del 31 de diciembre de ${year}`,d:'En California la segunda cuota vence el 10 de abril, pero puedes pagarla antes. Si la pagas en diciembre, cuenta en este año, en el que detallas y estás por debajo del tope SALT. Es un adelanto del ahorro (el año siguiente deducirás menos), útil si este año tu tipo es más alto.',tt:'Deductions & Credits → Your Home → Property Taxes: pon el total pagado en el año natural.',act:true}); } }
  // 8. Charity bunching
  if(!R.useItem&&R.itemized>R.C.std*0.75) add({t:'Agrupa los donativos en un solo año',save:0,kind:'estrategia',when:'Planificación',d:`Tu deducción detallada (${fmt(R.itemized)}) se queda cerca de la estándar (${fmt(R.C.std)}). Si concentras los donativos de dos años en uno (o usas un Donor-Advised Fund), ese año superarás la estándar y el otro tomarás la estándar.`,tt:''});
  // 9. Rental
  R.rentals.forEach(r=>{ if(r.depMissing) add({t:`Amortización de ${r.p.name}: probablemente la mayor deducción que te falta`,save:0,kind:'revisar',when:'Antes de declarar',d:'Cada año puedes deducir el valor de la construcción (sin el terreno) ÷ 27.5. Si nunca la has aplicado, la ley la cuenta igual al vender ("allowed or allowable"), así que conviene corregirlo; puede requerir el Form 3115. Pon el valor de la construcción y el año de inicio en Cuentas → Editar la casa.',tt:'Rental Properties → tu casa → Assets/Depreciation → Add asset → Residential Rental Real Estate.'});
    add({t:`Registra todos los gastos de ${r.p.name}`,save:0,kind:'revisar',when:'Todo el año',d:'Además de hipoteca, impuestos, seguro y HOA, también se deducen las reparaciones, los materiales, la gestión, la publicidad, los gastos legales, el desplazamiento (millas) y el seguro de responsabilidad civil. Regístralos como "Gastos alquiler".',tt:'Rental Properties → Expenses.'});
    if(R.rentalNetRaw<0&&R.rentalAllowed>R.rentalNetRaw) add({t:'Tu pérdida de alquiler no se pierde: se acumula',save:0,kind:'info',when:'',d:`Con un ingreso por encima de $150,000 la pérdida pasiva (${fmt(R.rentalNetRaw)}) no se deduce este año. Se acumula (Form 8582) y la usarás cuando la casa dé beneficios o cuando la vendas. Asegúrate de que TurboTax arrastra las pérdidas de años anteriores.`,tt:'Importa la declaración del año pasado al empezar; revisa "Passive activity loss carryover" en el alquiler.'}); });
  // 10. Tax-loss harvesting
  const taxable=S.accounts.filter(a=>a.kind==='brokerage'&&a.holdings&&a.holdings.rows.length);
  const losers=taxable.flatMap(a=>a.holdings.rows.filter(x=>x.gain!=null&&x.gain<0).map(x=>({...x,acc:a.name})));
  if(losers.length){ const tl=-losers.reduce((s,x)=>s+x.gain,0); const ded=Math.min(tl,3000+Math.max(0,R.capNet)); const sv=savingsOf(year,{k401:Math.min(tl,3000),caDelta:Math.min(tl,3000)});
    add({t:`Vende con pérdida ${losers.map(x=>x.sym).join(', ')} (${fmt(-tl)})`,save:sv.total,when:yearOpen?`Antes del 31 de diciembre de ${year}`:'',d:`Según tus posiciones del ${dLabel(taxable[0].holdings.date)}, ${losers.map(x=>`${x.sym} pierde ${fmt(-x.gain)}`).join('; ')}. Venderlas compensa ganancias y hasta $3,000 de sueldo; el resto pasa a años siguientes. Recompra algo parecido pero no idéntico (por ejemplo, otro fondo de un índice distinto) o espera 31 días para evitar la regla wash sale. En M1, venderlas desde el pie la reinvierte en los demás slices.`,tt:'Sale en el 1099-B de M1.',act:true}); }
  else if(taxable.length) add({t:'Sin pérdidas que aprovechar en M1',save:0,kind:'ok',when:'',d:`Con las posiciones del ${dLabel(taxable[0].holdings.date)} ninguna está en pérdidas, así que no hay tax-loss harvesting que hacer. Evita vender posiciones con ganancia en la cuenta normal salvo que lo necesites.`,tt:''});
  else if(S.accounts.some(a=>a.kind==='brokerage')) add({t:'Revisa pérdidas en M1 antes del 31 de diciembre',save:0,kind:'estrategia',when:yearOpen?`Antes del 31 de diciembre de ${year}`:'',d:`Si alguna posición de tu cuenta normal está en pérdidas, venderla compensa ganancias y hasta $3,000 de sueldo al año (${fmt(3000*R.marginal)} federales a tu tipo). Cuidado con la regla wash sale: no recompres lo mismo ni algo "sustancialmente idéntico" en los 30 días antes o después.`,tt:'Sale en el 1099-B de M1; impórtalo en Investments and Savings.'});
  // 11. Withholding
  if(R.balance>3000) add({t:`Ajusta tu W-4: estás prestando ${fmt(R.balance)} sin intereses a Hacienda`,save:0,kind:'estrategia',when:'Cuando quieras',d:'Una devolución grande significa que te retienen de más. Con el IRS Tax Withholding Estimator puedes ajustar el W-4 y cobrar ese dinero cada mes, por ejemplo para pagar principal extra de la hipoteca o invertir.',tt:''});
  if(R.balance<-1000) add({t:`Evita la multa: te faltan ${fmt(-R.balance)} de retención`,save:0,kind:'revisar',when:yearOpen?'Antes de fin de año':'',d:'Con un ingreso por encima de $150,000, te libras de la multa si has pagado al menos el 110% del impuesto del año pasado o el 90% del de este año. Sube la retención en el W-4 o haz un pago estimado (Form 1040-ES).',tt:''});
  // 12. 529
  if(K.u17>0&&!(P.c529>0)) add({t:'Para el ahorro de los niños, compara el 529 con la cuenta normal',save:0,kind:'futuro',when:'',d:'California no desgrava el 529, pero lo que crece no paga impuestos si se usa en estudios (y hasta $10,000 al año en colegio K-12). Si ya tienes el dinero en una cuenta normal, mover lo que hay supone realizar ganancias; plantéalo para las aportaciones nuevas.',tt:''});
  // 13. Mortgage > 750k
  R.mortRows.filter(m=>m.fF<1).forEach(m=>add({t:'Intereses de hipoteca por encima del límite federal',save:0,kind:'info',when:'',d:`Tu préstamo medio (${fmtK(m.avg)}) supera los $750,000 federales: deduces el ${Math.round(m.fF*100)}% en la federal y el 100% en California (límite $1M). TurboTax lo calcula si metes bien el principal pendiente y la fecha de origen.`,tt:'Your Home → Mortgage Interest (1098): contesta a las preguntas de "loan balance" y fecha del préstamo.'}));
  return out.sort((a,b)=>(b.save||0)-(a.save||0));
}

  steps.push({t:'Other Tax Situations / Estimates',b:`<ul><li>Estimated taxes paid: federal ${fmt(ty.estFed||0)} · California ${fmt(ty.estCA||0)}.</li><li>Comprueba que TurboTax compara la deducción detallada con la estándar. Debería salir <b>${R.useItem?'detallada (itemized) ≈ '+fmt(R.itemized):'estándar '+fmt(R.C.std)}</b>.</li></ul>`});

/* ---------- Copia y ajustes ---------- */
async function deriveKey(pass,salt){ const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']); return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']); }
const b64=u=>{let s='';u=new Uint8Array(u);for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function encryptState(pass){ const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12)); const key=await deriveKey(pass,salt); const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(Object.assign({},S,{secret:undefined})))); return JSON.stringify({app:'misfinanzas',v:1,salt:b64(salt),iv:b64(iv),data:b64(ct)}); }
async function decryptBackup(txt,pass){ const o=JSON.parse(txt); if(o.app!=='misfinanzas') throw new Error('No es una copia de Mis Finanzas'); const key=await deriveKey(pass,unb64(o.salt)); const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},key,unb64(o.data)); return JSON.parse(new TextDecoder().decode(pt)); }

/* ---------- Modal helpers ---------- */
function openModal(html){ $('#modal').innerHTML=html; $('#modalBg').classList.add('show'); setTimeout(()=>{const f=$('#modal').querySelector('input:not([type=checkbox]):not([type=radio])'); if(f&&window.innerWidth>700) f.focus();},50); }

function confirmModal(title,body){ return new Promise(res=>{ openModal(`<h2>${title}</h2>${body}<div class="row" style="margin-top:12px"><button id="cN">Cancelar</button><button class="pri" id="cY">Continuar</button></div>`); $('#cN').onclick=()=>{closeModal();res(false)}; $('#cY').onclick=()=>{closeModal();res(true)}; }); }

/* ============================================================
   Bóveda cifrada: contraseña maestra, passkey (WebAuthn PRF),
   clave de recuperación y bloqueo automático.
   - Los datos se cifran con una clave aleatoria (DK, AES-GCM 256).
   - La DK se guarda "envuelta" por cada método de desbloqueo.
   - Nada en claro toca el disco; nada sale del dispositivo.
   ============================================================ */
const VAULT={meta:null,dk:null,dkRaw:null};
const TE=new TextEncoder(), TD=new TextDecoder();
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const b64u=buf=>b64(buf).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const PW_ITER=600000, REC_ITER=200000;
async function kdfPass(pass,salt,it){ const k=await crypto.subtle.importKey('raw',TE.encode(pass),'PBKDF2',false,['deriveKey']); return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']); }
async function kdfPrf(out){ const base=await crypto.subtle.importKey('raw',out,'HKDF',false,['deriveKey']); return crypto.subtle.deriveKey({name:'HKDF',hash:'SHA-256',salt:TE.encode('myfinzen-prf-v1'),info:TE.encode('vault-kek')},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']); }
async function seal(key,bytes){ const iv=rnd(12); const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes); return {iv:b64(iv),ct:b64(ct)}; }
async function unseal(key,o){ return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},key,unb64(o.ct))); }
async function setDK(raw){ VAULT.dkRaw=raw; VAULT.dk=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['encrypt','decrypt']); }
function makeRecovery(){ const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; const r=rnd(24); let s=''; for(let i=0;i<24;i++){ s+=A[r[i]%A.length]; if(i%4===3&&i<23) s+='-'; } return s; }
const normRec=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
async function persist(){ if(!VAULT.dk||!S) return; VAULT.meta.data=await seal(VAULT.dk,TE.encode(JSON.stringify(S))); VAULT.meta.updated=new Date().toISOString(); await IDB.set('vault',VAULT.meta); }
async function createVault(pass){
  const raw=rnd(32); await setDK(raw);
  const salt=rnd(16), rsalt=rnd(16); const rec=makeRecovery();
  VAULT.meta={v:1,created:new Date().toISOString(),pw:{salt:b64(salt),it:PW_ITER,wrap:await seal(await kdfPass(pass,salt,PW_ITER),raw)},rec:{salt:b64(rsalt),it:REC_ITER,wrap:await seal(await kdfPass(normRec(rec),rsalt,REC_ITER),raw)},pk:[]};
  S=blankState(); await persist(); return rec;
}
async function loadState(){ S=JSON.parse(TD.decode(await unseal(VAULT.dk,VAULT.meta.data))); S.settings=Object.assign({emergencyMonths:6,lockMin:5},S.settings||{}); }
async function unlockWithPassword(pass){ const p=VAULT.meta.pw; const raw=await unseal(await kdfPass(pass,unb64(p.salt),p.it),p.wrap); await setDK(raw); await loadState(); }
async function unlockWithRecovery(code){ const r=VAULT.meta.rec; const raw=await unseal(await kdfPass(normRec(code),unb64(r.salt),r.it),r.wrap); await setDK(raw); await loadState(); }
async function setPassword(pass){ const salt=rnd(16); VAULT.meta.pw={salt:b64(salt),it:PW_ITER,wrap:await seal(await kdfPass(pass,salt,PW_ITER),VAULT.dkRaw)}; await persist(); }
async function newRecovery(){ const rec=makeRecovery(), rsalt=rnd(16); VAULT.meta.rec={salt:b64(rsalt),it:REC_ITER,wrap:await seal(await kdfPass(normRec(rec),rsalt,REC_ITER),VAULT.dkRaw)}; await persist(); return rec; }
function passkeyCapable(){ return !!(window.PublicKeyCredential&&navigator.credentials&&window.isSecureContext); }
function deviceName(){ const u=navigator.userAgent; if(/Android/.test(u)) return 'Android'; if(/iPhone|iPad/.test(u)) return 'iPhone/iPad'; if(/Mac/.test(u)) return 'Mac'; if(/Windows/.test(u)) return 'Windows'; return 'Dispositivo'; }
async function addPasskey(){
  const prfSalt=rnd(32);
  const cred=await navigator.credentials.create({publicKey:{rp:{name:'MyFinZen',id:location.hostname},user:{id:rnd(16),name:'MyFinZen · '+deviceName(),displayName:'MyFinZen'},challenge:rnd(32),
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{residentKey:'preferred',userVerification:'required'},timeout:120000,extensions:{prf:{eval:{first:prfSalt}}}}});
  const ext=cred.getClientExtensionResults()||{};
  if(!ext.prf||ext.prf.enabled===false) throw Object.assign(new Error('Este dispositivo o navegador no admite passkeys con cifrado (PRF). Usa la contraseña maestra.'),{code:'noprf'});
  let out=ext.prf.results&&ext.prf.results.first;
  if(!out){ const a=await navigator.credentials.get({publicKey:{challenge:rnd(32),rpId:location.hostname,allowCredentials:[{type:'public-key',id:cred.rawId}],userVerification:'required',timeout:120000,extensions:{prf:{eval:{first:prfSalt}}}}});
    const e2=a.getClientExtensionResults()||{}; out=e2.prf&&e2.prf.results&&e2.prf.results.first; }
  if(!out) throw Object.assign(new Error('Este dispositivo o navegador no admite passkeys con cifrado (PRF). Usa la contraseña maestra.'),{code:'noprf'});
  VAULT.meta.pk.push({id:b64u(cred.rawId),prfSalt:b64(prfSalt),wrap:await seal(await kdfPrf(out),VAULT.dkRaw),created:today(),name:deviceName()});
  await persist();
}
async function unlockWithPasskey(){
  const pk=VAULT.meta.pk; if(!pk.length) throw new Error('No hay passkeys');
  const fromU=s=>unb64(s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((s.length+3)%4));
  const a=await navigator.credentials.get({publicKey:{challenge:rnd(32),rpId:location.hostname,allowCredentials:pk.map(p=>({type:'public-key',id:fromU(p.id)})),userVerification:'required',timeout:120000,
    extensions:{prf:{evalByCredential:Object.fromEntries(pk.map(p=>[p.id,{first:unb64(p.prfSalt)}]))}}}});
  const id=b64u(a.rawId); const p=pk.find(x=>x.id===id); const e=a.getClientExtensionResults()||{}; const out=e.prf&&e.prf.results&&e.prf.results.first;
  if(!p||!out) throw new Error('La passkey no devolvió la clave. Usa la contraseña maestra.');
  await setDK(await unseal(await kdfPrf(out),p.wrap)); await loadState();
}
/* ---------- Bloqueo ---------- */
let lockTimer=null, hiddenAt=0;
function lockNow(){ if(VAULT.dkRaw) VAULT.dkRaw.fill(0); VAULT.dk=null; VAULT.dkRaw=null; S=null; closeModal(); $('#app').innerHTML=''; showGate('unlock',true); }
function bumpLock(){ clearTimeout(lockTimer); if(!S) return; const m=(S.settings&&S.settings.lockMin)||5; lockTimer=setTimeout(()=>{ if(S) lockNow(); },m*60000); }
['pointerdown','keydown','scroll','touchstart'].forEach(ev=>window.addEventListener(ev,()=>{ if(S) bumpLock(); },{passive:true}));
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ hiddenAt=Date.now(); if(S) persist(); } else if(S&&hiddenAt&&Date.now()-hiddenAt>((S.settings.lockMin||5)*60000)) lockNow(); });

function enterApp(first){ const g=$('#gate'); g.style.display='none'; g.innerHTML=''; document.body.classList.remove('locked'); bumpLock(); if(first&&!location.hash) location.hash='#resumen'; route(); if(first) setTimeout(()=>openModal(`<h2>Todo listo</h2><p>Tus datos se guardan cifrados en este dispositivo.</p><ul><li>Si vienes de la versión de claude.ai: <b>Copia y ajustes → Restaurar copia</b>.</li><li>Haz copias cifradas de vez en cuando y guárdalas en Dropbox.</li><li>Para usar Claude, pega tu clave de API en <b>Copia y ajustes</b> (opcional).</li></ul><div class="row"><button class="pri" id="mc">Entendido</button></div>`)||($('#mc').onclick=closeModal),200); }
/* ---------- Claude con la clave del usuario ---------- */
const MODELS={quick:'claude-haiku-5-5',default:'claude-sonnet-5-5',complex:'claude-opus-5-5'};
function parseJSONLoose(t){ const s=String(t||'').replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,''); const a=s.indexOf('{'), b=s.lastIndexOf('}'); return JSON.parse(a>=0?s.slice(a,b+1):s); }
async function claudeCall(prompt,opts={}){
  const key=S&&S.secret&&S.secret.apiKey; if(!key) throw Object.assign(new Error('Añade tu clave de API de Anthropic en Copia y ajustes'),{code:'no_key'});
  const stream=opts.stream!==false&&!!opts.onText;
  const body={model:MODELS[opts.modelTier||'default']||MODELS.default,max_tokens:opts.maxTokens||8000,stream,messages:[{role:'user',content:prompt}]};
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:opts.signal,headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
