<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyFinZen</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.anthropic.com https://raw.githubusercontent.com; worker-src 'self' blob:; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2a78d6">
<meta name="description" content="Finanzas personales cifradas en tu dispositivo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyFinZen">
<script src="vendor/pdf.min.js"></script>
<script src="help.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#f4f4f1; --surface:#fcfcfb; --surface-2:#f0efec; --border:#e2e1dc;
  --text:#0b0b0b; --text-2:#52514e; --muted:#7c7b76;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-text:#006300; --crit-text:#b02a2a;
  --accent:#2a78d6; --accent-ink:#fff;
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#111110; --surface:#1a1a19; --surface-2:#242422; --border:#33332f;
    --text:#f0efec; --text-2:#c3c2b7; --muted:#8e8d86;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --good-text:#4cc24c; --crit-text:#ef7b7b;
    --accent:#3987e5;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px 4px;max-width:1200px;margin:0 auto}
.top h1{font-size:17px;margin:0;font-weight:650}
.top .lock{font-size:12px;color:var(--text-2);margin-left:auto;display:flex;align-items:center;gap:6px}
nav{display:flex;gap:4px;overflow-x:auto;padding:4px 12px 8px;max-width:1200px;margin:0 auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;text-decoration:none;color:var(--text-2);padding:6px 12px;border-radius:999px;font-size:14px;white-space:nowrap}
nav a.on{background:var(--text);color:var(--surface)}
main{max-width:1200px;margin:0 auto;padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;min-width:0}
.card h2{font-size:15px;margin:0 0 2px;font-weight:650}
.card .sub{font-size:13px;color:var(--text-2);margin:0 0 10px}
.stat .lbl{font-size:13px;color:var(--text-2)}
.stat .val{font-size:26px;font-weight:650;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stat .note{font-size:12px;color:var(--muted)}
.pos{color:var(--good-text)} .neg{color:var(--crit-text)}
h3.sec{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:22px 2px 8px;font-weight:600}
button,.btn{font:inherit;font-size:14px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:9px;cursor:pointer}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.dan{color:var(--crit-text)}
button:disabled{opacity:.5;cursor:default}
button.sm{padding:4px 10px;font-size:13px}
input,select,textarea{font:inherit;font-size:14px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 9px;width:100%}
textarea{min-height:90px}
label.f{display:block;font-size:13px;color:var(--text-2);margin-bottom:8px}
label.f > input,label.f > select{margin-top:3px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > *{flex:1;min-width:130px}
.row > button{flex:none;min-width:0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--text-2);font-weight:550;border-bottom:1px solid var(--border);padding:6px 6px}
td{border-bottom:1px solid var(--border);padding:6px;vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl{overflow-x:auto}
td select{padding:3px 6px;font-size:13px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--surface-2);margin-bottom:8px;font-size:14px}
.alert .ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff}
.alert.good .ic{background:var(--good)} .alert.warn .ic{background:var(--warn);color:#1a1a19} .alert.crit .ic{background:var(--crit)} .alert.info .ic{background:var(--s1)}
.alert b{font-weight:600}
.empty{padding:28px 10px;text-align:center;color:var(--text-2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2);margin:2px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart .grid line{stroke:var(--border)}
.chart text{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.tip{position:absolute;pointer-events:none;background:var(--text);color:var(--surface);font-size:12.5px;padding:7px 9px;border-radius:8px;white-space:nowrap;z-index:5;opacity:0;transition:opacity .08s;line-height:1.4}
.tip .k{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.hb{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:6px 10px;align-items:center;font-size:13.5px}
.hb .bar{height:12px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.hb .bar span{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--s1)}
.hb .v{font-variant-numeric:tabular-nums;color:var(--text-2);text-align:right}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--text-2)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal-bg.show{display:flex}
@media(min-width:700px){.modal-bg{align-items:center}}
.modal{background:var(--surface);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px}
@media(min-width:700px){.modal{border-radius:16px}}
.modal h2{margin:0 0 12px;font-size:17px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.ai-out{font-size:14.5px;line-height:1.55}
.ai-out h4{margin:14px 0 4px;font-size:15px}
.ai-out ul{padding-left:20px;margin:4px 0}
.ai-out p{margin:6px 0}
details summary{cursor:pointer;color:var(--text-2);font-size:13px}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:var(--surface-2);padding:10px;border-radius:8px;max-height:300px;overflow:auto}
.drop{border:2px dashed var(--border);border-radius:12px;padding:22px;text-align:center;color:var(--text-2)}
.pick{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 22px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;overflow:hidden}
.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;padding:0;border:0}
.drop.over{border-color:var(--accent);color:var(--text)}
.muted{color:var(--muted);font-size:13px}
.spacer{height:10px}
.tabs-inline{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
 .gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.gate-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;width:100%;max-width:420px}
.gate-card h2{font-size:18px;margin:6px 0 8px}
.gate-logo{display:flex;gap:12px;align-items:center;margin-bottom:10px}.gate-logo img{width:44px;height:44px;border-radius:10px}
.reccode{font:600 17px/1.6 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;background:var(--surface-2);border-radius:10px;padding:12px;text-align:center;margin:8px 0;word-break:break-all;user-select:all}
body.locked header,body.locked main{visibility:hidden}
.updbar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:70;background:var(--text);color:var(--surface);padding:8px 10px 8px 14px;border-radius:12px;font-size:14px;display:flex;gap:10px;align-items:center}
@media(max-width:520px){.hide-sm{display:none}}
header{padding-top:env(safe-area-inset-top)}
.range{display:flex;align-items:center;gap:10px}
.card{position:relative}
.ib{position:absolute;top:10px;right:10px;width:22px;height:22px;min-width:0;padding:0;border:0;border-radius:50%;background:var(--s1);color:#fff;font:italic 700 14px/22px Georgia,"Times New Roman",serif;text-align:center;cursor:pointer;z-index:2}
.ib:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.ib.inl{position:static;display:inline-block;vertical-align:1px;margin-left:6px;width:18px;height:18px;font-size:12px;line-height:18px}
.card:has(> .ib) > h2,.card:has(> .ib) > .row:first-of-type,.card:has(> .ib) > .lbl,.card:has(> .ib) > p:first-of-type{padding-right:28px}
.help ol{padding-left:20px;margin:6px 0} .help li{margin:4px 0} .help p{margin:6px 0}
.man h2{margin:22px 0 6px;font-size:17px} .man h3{margin:16px 0 4px;font-size:15px} .man p,.man li{line-height:1.55} .man ol,.man ul{padding-left:20px}
.man .toc a{display:inline-block;margin:2px 8px 2px 0}
.langsw{display:flex;gap:6px;justify-content:center;margin-top:12px} .langsw button.on{background:var(--text);color:var(--surface)}
.range input[type=range]{flex:1;padding:0;border:none;background:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
a.btn{text-decoration:none;display:inline-block}
/* ---------- Terminal de noticias ---------- */
.term{--t-bg:#0b0e0d;--t-bg2:#121816;--t-line:#1e2925;--t-row:#151d1a;--t-text:#e6eee9;--t-dim:#8a9c94;--t-amber:#f5a524;--t-green:#4fd48a;--t-blue:#8cb8ff;--t-red:#ff7b72;
  background:var(--t-bg);color:var(--t-text);border:1px solid var(--t-line);border-radius:12px;overflow:hidden;font:13px/1.45 ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace}
.term a{color:inherit}
.term-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;background:var(--t-bg2);border-bottom:1px solid var(--t-line);font-size:12px;letter-spacing:.04em}
.term-bar b{color:var(--t-amber);font-weight:700;letter-spacing:.08em}
.term-bar .st{color:var(--t-dim)}
.term-bar .sp{margin-left:auto}
.term-live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--t-green);margin-right:5px;vertical-align:1px;box-shadow:0 0 6px var(--t-green);animation:tpulse 2s infinite}
.term-live.old{background:var(--t-amber);box-shadow:none;animation:none}.term-live.off{background:var(--t-red);box-shadow:none;animation:none}
@keyframes tpulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.term-live{animation:none}}
.term button{font:inherit;font-size:12px;background:transparent;color:var(--t-dim);border:1px solid var(--t-line);border-radius:6px;padding:3px 9px}
.term button:hover{color:var(--t-text);border-color:var(--t-dim)}
.term-tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--t-line);scrollbar-width:none}
.term-tabs::-webkit-scrollbar{display:none}
.term-tabs button{flex:none;border:0;border-right:1px solid var(--t-line);border-radius:0;padding:9px 14px;text-transform:uppercase;letter-spacing:.07em;color:var(--t-dim)}
.term-tabs button .fk{color:var(--t-amber);margin-right:7px;font-weight:700}
.term-tabs button.on{background:var(--t-amber);color:#111}
.term-tabs button.on .fk{color:#111}
.term-cmd{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--t-line)}
.term-cmd .pr{color:var(--t-amber);font-weight:700}
.term-cmd input{flex:1;background:transparent;border:0;color:var(--t-text);font:inherit;padding:4px 0;outline:none;min-width:0}
.term-cmd input::placeholder{color:#5d6d66}
.term-chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--t-line)}
.term .chip{padding:3px 9px;border-radius:999px;font-size:12px}
.term .chip.on{background:var(--t-blue);border-color:var(--t-blue);color:#0b0e0d}
.term .chip i{font-style:normal;opacity:.7;margin-left:4px}
.term-note{padding:8px 12px;border-bottom:1px solid var(--t-line);color:var(--t-dim);font-size:12px}
.term-note.warn{color:var(--t-amber)}
.term-row{display:grid;grid-template-columns:50px 1fr auto;gap:2px 10px;padding:8px 12px;border-bottom:1px solid var(--t-row);align-items:start}
.term-row:hover{background:var(--t-bg2)}
.term-row .tm{color:var(--t-green);font-variant-numeric:tabular-nums;padding-top:1px}
.term-row .tm.old{color:var(--t-dim)}
.term-row .hl{color:var(--t-text);text-decoration:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14.5px;line-height:1.35;overflow-wrap:anywhere}
.term-row .hl:hover{color:var(--t-amber);text-decoration:underline}
.term-row .hl:visited{color:#b7c4be}
.term-row .mt{grid-column:2;font-size:11.5px;color:var(--t-dim);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.term-row .src{color:var(--t-amber);text-transform:uppercase;letter-spacing:.05em}
.term-row .tk{color:var(--t-blue);border:1px solid #2b3f5f;border-radius:4px;padding:0 5px}
.term-row .rg{color:var(--t-dim);border:1px solid var(--t-line);border-radius:4px;padding:0 5px}
.term-row .x{grid-row:1/3;grid-column:3;border:0;padding:0 4px;color:#4f5f58;font-size:15px;line-height:1}
.term-row .x:hover{color:var(--t-red)}
.term-empty{padding:28px 14px;text-align:center;color:var(--t-dim)}
.term-foot{padding:9px 12px;color:var(--t-dim);font-size:11.5px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:var(--t-bg2)}
.term-foot details{width:100%}
.term-foot summary{color:var(--t-dim);font-size:11.5px}
.term-foot table{font-size:11.5px;margin-top:6px}
.term-foot td,.term-foot th{border-color:var(--t-line);color:var(--t-dim);padding:3px 6px}
.term-foot .ok{color:var(--t-green)} .term-foot .ko{color:var(--t-red)}
.term-row .src2{display:none;color:var(--t-amber);text-transform:uppercase;letter-spacing:.04em;font-size:11.5px;padding-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(min-width:760px){.term-row{grid-template-columns:50px 150px 1fr auto}.term-row .hl{grid-column:3}.term-row .mt{grid-column:3}.term-row .src2{display:block}.term-row .src1{display:none}.term-row .x{grid-column:4}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>MyFinZen</h1>
    <span class="lock"><span class="hide-sm" id="encTxt"></span><button class="sm" id="lockBtn"></button></span>
  </div>
  <nav id="nav"></nav>
</header>
<main id="app"></main>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<div id="gate" class="gate" style="display:none"></div>
<div id="updBar" class="updbar" style="display:none"><span id="updTxt"></span> <button class="sm pri" id="updGo"></button></div>
<div class="tip" id="tip"></div>

<script src="app.js"></script>
</body>
</html>
