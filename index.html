<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyFinZen</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.anthropic.com https://raw.githubusercontent.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2a78d6">
<meta name="description" content="Finanzas personales cifradas en tu dispositivo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyFinZen">
<script src="vendor/pdf.min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#f4f4f1; --surface:#fcfcfb; --surface-2:#f0efec; --border:#e2e1dc;
  --text:#0b0b0b; --text-2:#52514e; --muted:#7c7b76;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-text:#006300; --crit-text:#b02a2a;
  --accent:#2a78d6; --accent-ink:#fff;
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#111110; --surface:#1a1a19; --surface-2:#242422; --border:#33332f;
    --text:#f0efec; --text-2:#c3c2b7; --muted:#8e8d86;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --good-text:#4cc24c; --crit-text:#ef7b7b;
    --accent:#3987e5;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px 4px;max-width:1200px;margin:0 auto}
.top h1{font-size:17px;margin:0;font-weight:650}
.top .lock{font-size:12px;color:var(--text-2);margin-left:auto;display:flex;align-items:center;gap:6px}
nav{display:flex;gap:4px;overflow-x:auto;padding:4px 12px 8px;max-width:1200px;margin:0 auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;text-decoration:none;color:var(--text-2);padding:6px 12px;border-radius:999px;font-size:14px;white-space:nowrap}
nav a.on{background:var(--text);color:var(--surface)}
main{max-width:1200px;margin:0 auto;padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;min-width:0}
.card h2{font-size:15px;margin:0 0 2px;font-weight:650}
.card .sub{font-size:13px;color:var(--text-2);margin:0 0 10px}
.stat .lbl{font-size:13px;color:var(--text-2)}
.stat .val{font-size:26px;font-weight:650;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stat .note{font-size:12px;color:var(--muted)}
.pos{color:var(--good-text)} .neg{color:var(--crit-text)}
h3.sec{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:22px 2px 8px;font-weight:600}
button,.btn{font:inherit;font-size:14px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:9px;cursor:pointer}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.dan{color:var(--crit-text)}
button:disabled{opacity:.5;cursor:default}
button.sm{padding:4px 10px;font-size:13px}
input,select,textarea{font:inherit;font-size:14px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 9px;width:100%}
textarea{min-height:90px}
label.f{display:block;font-size:13px;color:var(--text-2);margin-bottom:8px}
label.f > input,label.f > select{margin-top:3px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > *{flex:1;min-width:130px}
.row > button{flex:none;min-width:0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--text-2);font-weight:550;border-bottom:1px solid var(--border);padding:6px 6px}
td{border-bottom:1px solid var(--border);padding:6px;vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl{overflow-x:auto}
td select{padding:3px 6px;font-size:13px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--surface-2);margin-bottom:8px;font-size:14px}
.alert .ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff}
.alert.good .ic{background:var(--good)} .alert.warn .ic{background:var(--warn);color:#1a1a19} .alert.crit .ic{background:var(--crit)} .alert.info .ic{background:var(--s1)}
.alert b{font-weight:600}
.empty{padding:28px 10px;text-align:center;color:var(--text-2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2);margin:2px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart .grid line{stroke:var(--border)}
.chart text{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.tip{position:absolute;pointer-events:none;background:var(--text);color:var(--surface);font-size:12.5px;padding:7px 9px;border-radius:8px;white-space:nowrap;z-index:5;opacity:0;transition:opacity .08s;line-height:1.4}
.tip .k{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.hb{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:6px 10px;align-items:center;font-size:13.5px}
.hb .bar{height:12px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.hb .bar span{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--s1)}
.hb .v{font-variant-numeric:tabular-nums;color:var(--text-2);text-align:right}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--text-2)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal-bg.show{display:flex}
@media(min-width:700px){.modal-bg{align-items:center}}
.modal{background:var(--surface);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px}
@media(min-width:700px){.modal{border-radius:16px}}
.modal h2{margin:0 0 12px;font-size:17px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.ai-out{font-size:14.5px;line-height:1.55}
.ai-out h4{margin:14px 0 4px;font-size:15px}
.ai-out ul{padding-left:20px;margin:4px 0}
.ai-out p{margin:6px 0}
details summary{cursor:pointer;color:var(--text-2);font-size:13px}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:var(--surface-2);padding:10px;border-radius:8px;max-height:300px;overflow:auto}
.drop{border:2px dashed var(--border);border-radius:12px;padding:22px;text-align:center;color:var(--text-2)}
.pick{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 22px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;overflow:hidden}
.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;padding:0;border:0}
.drop.over{border-color:var(--accent);color:var(--text)}
.muted{color:var(--muted);font-size:13px}
.spacer{height:10px}
.tabs-inline{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
 .gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.gate-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;width:100%;max-width:420px}
.gate-card h2{font-size:18px;margin:6px 0 8px}
.gate-logo{display:flex;gap:12px;align-items:center;margin-bottom:10px}.gate-logo img{width:44px;height:44px;border-radius:10px}
.reccode{font:600 17px/1.6 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;background:var(--surface-2);border-radius:10px;padding:12px;text-align:center;margin:8px 0;word-break:break-all;user-select:all}
body.locked header,body.locked main{visibility:hidden}
.updbar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:70;background:var(--text);color:var(--surface);padding:8px 10px 8px 14px;border-radius:12px;font-size:14px;display:flex;gap:10px;align-items:center}
@media(max-width:520px){.hide-sm{display:none}}
header{padding-top:env(safe-area-inset-top)}
.range{display:flex;align-items:center;gap:10px}
.range input[type=range]{flex:1;padding:0;border:none;background:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
a.btn{text-decoration:none;display:inline-block}
/* ---------- Terminal de noticias ---------- */
.term{--t-bg:#0b0e0d;--t-bg2:#121816;--t-line:#1e2925;--t-row:#151d1a;--t-text:#e6eee9;--t-dim:#8a9c94;--t-amber:#f5a524;--t-green:#4fd48a;--t-blue:#8cb8ff;--t-red:#ff7b72;
  background:var(--t-bg);color:var(--t-text);border:1px solid var(--t-line);border-radius:12px;overflow:hidden;font:13px/1.45 ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace}
.term a{color:inherit}
.term-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;background:var(--t-bg2);border-bottom:1px solid var(--t-line);font-size:12px;letter-spacing:.04em}
.term-bar b{color:var(--t-amber);font-weight:700;letter-spacing:.08em}
.term-bar .st{color:var(--t-dim)}
.term-bar .sp{margin-left:auto}
.term-live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--t-green);margin-right:5px;vertical-align:1px;box-shadow:0 0 6px var(--t-green);animation:tpulse 2s infinite}
.term-live.old{background:var(--t-amber);box-shadow:none;animation:none}.term-live.off{background:var(--t-red);box-shadow:none;animation:none}
@keyframes tpulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.term-live{animation:none}}
.term button{font:inherit;font-size:12px;background:transparent;color:var(--t-dim);border:1px solid var(--t-line);border-radius:6px;padding:3px 9px}
.term button:hover{color:var(--t-text);border-color:var(--t-dim)}
.term-tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--t-line);scrollbar-width:none}
.term-tabs::-webkit-scrollbar{display:none}
.term-tabs button{flex:none;border:0;border-right:1px solid var(--t-line);border-radius:0;padding:9px 14px;text-transform:uppercase;letter-spacing:.07em;color:var(--t-dim)}
.term-tabs button .fk{color:var(--t-amber);margin-right:7px;font-weight:700}
.term-tabs button.on{background:var(--t-amber);color:#111}
.term-tabs button.on .fk{color:#111}
.term-cmd{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--t-line)}
.term-cmd .pr{color:var(--t-amber);font-weight:700}
.term-cmd input{flex:1;background:transparent;border:0;color:var(--t-text);font:inherit;padding:4px 0;outline:none;min-width:0}
.term-cmd input::placeholder{color:#5d6d66}
.term-chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--t-line)}
.term .chip{padding:3px 9px;border-radius:999px;font-size:12px}
.term .chip.on{background:var(--t-blue);border-color:var(--t-blue);color:#0b0e0d}
.term .chip i{font-style:normal;opacity:.7;margin-left:4px}
.term-note{padding:8px 12px;border-bottom:1px solid var(--t-line);color:var(--t-dim);font-size:12px}
.term-note.warn{color:var(--t-amber)}
.term-row{display:grid;grid-template-columns:50px 1fr auto;gap:2px 10px;padding:8px 12px;border-bottom:1px solid var(--t-row);align-items:start}
.term-row:hover{background:var(--t-bg2)}
.term-row .tm{color:var(--t-green);font-variant-numeric:tabular-nums;padding-top:1px}
.term-row .tm.old{color:var(--t-dim)}
.term-row .hl{color:var(--t-text);text-decoration:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14.5px;line-height:1.35;overflow-wrap:anywhere}
.term-row .hl:hover{color:var(--t-amber);text-decoration:underline}
.term-row .hl:visited{color:#b7c4be}
.term-row .mt{grid-column:2;font-size:11.5px;color:var(--t-dim);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.term-row .src{color:var(--t-amber);text-transform:uppercase;letter-spacing:.05em}
.term-row .tk{color:var(--t-blue);border:1px solid #2b3f5f;border-radius:4px;padding:0 5px}
.term-row .rg{color:var(--t-dim);border:1px solid var(--t-line);border-radius:4px;padding:0 5px}
.term-row .x{grid-row:1/3;grid-column:3;border:0;padding:0 4px;color:#4f5f58;font-size:15px;line-height:1}
.term-row .x:hover{color:var(--t-red)}
.term-empty{padding:28px 14px;text-align:center;color:var(--t-dim)}
.term-foot{padding:9px 12px;color:var(--t-dim);font-size:11.5px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:var(--t-bg2)}
.term-foot details{width:100%}
.term-foot summary{color:var(--t-dim);font-size:11.5px}
.term-foot table{font-size:11.5px;margin-top:6px}
.term-foot td,.term-foot th{border-color:var(--t-line);color:var(--t-dim);padding:3px 6px}
.term-foot .ok{color:var(--t-green)} .term-foot .ko{color:var(--t-red)}
.term-row .src2{display:none;color:var(--t-amber);text-transform:uppercase;letter-spacing:.04em;font-size:11.5px;padding-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(min-width:760px){.term-row{grid-template-columns:50px 150px 1fr auto}.term-row .hl{grid-column:3}.term-row .mt{grid-column:3}.term-row .src2{display:block}.term-row .src1{display:none}.term-row .x{grid-column:4}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>MyFinZen</h1>
    <span class="lock"><span class="hide-sm">Cifrado en este dispositivo</span><button class="sm" id="lockBtn" title="Bloquear">🔒 Bloquear</button></span>
  </div>
  <nav id="nav">
    <a href="#resumen">Resumen</a>
    <a href="#flujo">Ingresos y gastos</a>
    <a href="#hipotecas">Hipotecas</a>
    <a href="#inversiones">Inversiones</a>
    <a href="#alquiler">Casa en alquiler</a>
    <a href="#cuentas">Cuentas</a>
    <a href="#importar">Importar</a>
    <a href="#impuestos">Impuestos</a>
    <a href="#claude">Claude</a>
    <a href="#ajustes">Copia y ajustes</a>
  </nav>
</header>
<main id="app"></main>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<div id="gate" class="gate" style="display:none"></div>
<div id="updBar" class="updbar" style="display:none">Hay una versión nueva de MyFinZen. <button class="sm pri" id="updGo">Actualizar</button></div>
<div class="tip" id="tip"></div>

<script>
"use strict";
/* ============================================================
   Storage — everything lives in IndexedDB on this device
   ============================================================ */
const KINDS = {
  cash:{label:'Banco / ahorro', asset:true},
  credit:{label:'Tarjeta de crédito', asset:false},
  brokerage:{label:'Inversión', asset:true},
  retirement:{label:'Jubilación', asset:true},
  kids:{label:'Ahorro hijos', asset:true},
  property:{label:'Inmueble', asset:true},
  mortgage:{label:'Hipoteca', asset:false},
  other:{label:'Otro activo', asset:true},
};
const CATS = {
  income:['Nómina','Renta alquiler','Intereses/dividendos','Otros ingresos'],
  expense:['Hipoteca casa','Hipoteca alquiler','HOA alquiler','Gastos alquiler','Impuestos propiedad','Supermercado','Restaurantes','Gasolina','Coche','Seguros','Suministros','Niños','Salud','Compras','Ocio','Viajes','Suscripciones','Educación','Impuestos','Otros gastos'],
  neutral:['Transferencia','Pago tarjeta','Aportación inversión']
};
const DEFAULT_RULES = [
  ['PAYROLL|DIRECT DEP|DIR DEP|SALARY|NOMINA','Nómina'],
  ['PENNYMAC','Hipoteca casa'],
  ['HOA|HOMEOWNERS ASSOC|ASSOCIATION|COMMUNITY MGMT|FIRSTSERVICE|PROPERTY MGMT','HOA alquiler'],
  ['RENT FROM|RENTAL INCOME|TENANT','Renta alquiler'],
  ['PAYMENT THANK|AUTOPAY PAYMENT|AUTOMATIC PAYMENT|CARD PAYMENT|ONLINE PAYMENT|EPAY|PAYMENT - THANK|CRCARDPMT|PMT TO CREDIT','Pago tarjeta'],
  ['M1 FINANCE|M1 FIN|VANGUARD|FIDELITY|SCHWAB|ROBINHOOD','Aportación inversión'],
  ['ZELLE|VENMO|TRANSFER|XFER|WIRE','Transferencia'],
  ['COSTCO|TRADER JOE|VONS|RALPHS|ALBERTSONS|WHOLE FOODS|SPROUTS|ALDI|STATER|SMART & FINAL|H MART|99 RANCH|NORTHGATE|GROCERY|SAFEWAY|WINCO|FOOD 4 LESS','Supermercado'],
  ['SHELL|CHEVRON|ARCO|MOBIL|EXXON|76 |CIRCLE K|VALERO|COSTCO GAS|FUEL|EV CHARG|TESLA SUPERCH|ELECTRIFY','Gasolina'],
  ['RESTAUR|CAFE|COFFEE|STARBUCKS|MCDONALD|CHIPOTLE|IN-N-OUT|DOORDASH|UBER EATS|GRUBHUB|PIZZA|TACO|SUSHI|GRILL|BAKERY|BAR ','Restaurantes'],
  ['NETFLIX|SPOTIFY|HULU|DISNEY|YOUTUBE|APPLE.COM|ICLOUD|GOOGLE \\*|AMAZON PRIME|PRIME VIDEO|HBO|MAX.COM|OPENAI|ANTHROPIC|CLAUDE','Suscripciones'],
  ['EDISON|SCE |SOCALGAS|SO CAL GAS|SOCAL GAS|WATER|SPECTRUM|AT&T|VERIZON|T-MOBILE|TMOBILE|COX |FRONTIER|UTILIT','Suministros'],
  ['GEICO|STATE FARM|ALLSTATE|PROGRESSIVE|FARMERS|MERCURY INS|INSURANCE|LIBERTY MUT','Seguros'],
  ['DMV|AUTO REPAIR|JIFFY|CAR WASH|TOYOTA|HONDA|INFINITI|NISSAN|TESLA|PARKING|TOLL|FASTRAK','Coche'],
  ['CVS|WALGREENS|PHARM|MEDICAL|DENTAL|CLINIC|HOSPITAL|KAISER|HEALTH','Salud'],
  ['AMAZON|AMZN|TARGET|WALMART|HOME DEPOT|LOWE|IKEA|BEST BUY|MARSHALLS|TJ MAXX|ROSS ','Compras'],
  ['DAYCARE|PRESCHOOL|KIDS|TOYS|CHILDREN|GYMBOREE|BABY','Niños'],
  ['AIRLINE|DELTA|UNITED|AMERICAN AIR|SOUTHWEST|IBERIA|HOTEL|AIRBNB|EXPEDIA|MARRIOTT|HILTON','Viajes'],
  ['TAX COLLECTOR|TREASURER|FRANCHISE TAX|IRS','Impuestos'],
  ['INTEREST PAID|INTEREST EARNED|DIVIDEND','Intereses/dividendos'],
];
function catType(c){ if(CATS.income.includes(c))return 'income'; if(CATS.neutral.includes(c))return 'neutral'; return 'expense'; }

let S = null; // state
function blankState(){
  return {v:1, accounts:[], snapshots:[], tx:[], rules:DEFAULT_RULES.map(r=>({pattern:r[0],cat:r[1]})),
          settings:{emergencyMonths:6, lastBackup:null, lastAI:null}, created:new Date().toISOString()};
}
const IDB = {
  db:null, mem:null,
  open(){ return new Promise((res)=>{ try{ const r=indexedDB.open('misfinanzas',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>{this.db=r.result;res(true)}; r.onerror=()=>res(false);}catch(e){res(false)} }); },
  get(k){ if(!this.db) return Promise.resolve(this.mem&&this.mem[k]); return new Promise(res=>{ try{const t=this.db.transaction('kv').objectStore('kv').get(k); t.onsuccess=()=>res(t.result); t.onerror=()=>res(null);}catch(e){res(null)} }); },
  set(k,v){ if(!this.db){ this.mem=this.mem||{}; this.mem[k]=v; return Promise.resolve(); } return new Promise(res=>{ try{const tx=this.db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>res();}catch(e){res()} }); }
};
let saveTimer=null;
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>{ persist(); },200); }

/* ============================================================
   Utilities
   ============================================================ */
const $=(s,r=document)=>r.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const fmt=(n,d=0)=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtK=n=>{const a=Math.abs(n); const s=n<0?'-':''; if(a>=1e6)return s+'$'+(a/1e6).toFixed(a>=1e7?1:2)+'M'; if(a>=1e3)return s+'$'+(a/1e3).toFixed(a>=1e5?0:1)+'k'; return s+'$'+a.toFixed(0);};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const ym=d=>d.slice(0,7);
const ymLabel=k=>{const [y,m]=k.split('-');return MES[+m-1]+' '+y.slice(2)};
const dLabel=d=>{const [y,m,dd]=d.split('-');return +dd+' '+MES[+m-1]+' '+y};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600);}
function num(v){ if(v==null)return NaN; let s=String(v).trim(); if(!s)return NaN; let neg=/^\(.*\)$/.test(s)||/^-/.test(s)||/-$/.test(s); s=s.replace(/[^0-9.,]/g,''); if(/,\d{2}$/.test(s)&&!/\.\d{2}$/.test(s)) s=s.replace(/\./g,'').replace(',','.'); else s=s.replace(/,/g,''); const n=parseFloat(s); return isNaN(n)?NaN:(neg?-n:n); }
function parseDate(s){
  s=String(s||'').trim(); let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if(m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/)){ let y=m[3].length===2?'20'+m[3]:m[3]; return `${y}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`; }
  const d=new Date(s); if(!isNaN(d)) return d.toISOString().slice(0,10);
  return null;
}
const acc=id=>S.accounts.find(a=>a.id===id);
function accName(id){const a=acc(id);return a?a.name:'—';}

/* ============================================================
   Domain calculations
   ============================================================ */
function lastSnap(accId, upTo){
  let best=null; for(const s of S.snapshots){ if(s.acc!==accId) continue; if(upTo && s.date>upTo) continue; if(!best||s.date>best.date) best=s; } return best;
}
function balanceOf(a, upTo){ const s=lastSnap(a.id, upTo); return s?s.value:null; }
function netWorthAt(upTo){
  let assets=0, liab=0, any=false;
  for(const a of S.accounts){ const b=balanceOf(a,upTo); if(b==null) continue; any=true; if(KINDS[a.kind].asset) assets+=b; else liab+=b; }
  return any?{assets,liab,net:assets-liab}:null;
}
function monthsRange(n){ const out=[]; const d=new Date(); d.setDate(1); for(let i=n-1;i>=0;i--){ const x=new Date(d.getFullYear(), d.getMonth()-i, 1); out.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')); } return out; }
function monthEnd(k){ const [y,m]=k.split('-').map(Number); const d=new Date(y,m,0); return `${y}-${String(m).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
// Hipotecas como coste fijo mensual: cuota + escrow + extra del extracto, cada mes con datos,
// aunque el cargo caiga en otro mes (pago adelantado) o no esté importado.
function fixedMortgages(){
  const out=S.accounts.filter(a=>a.kind==='mortgage'&&mortMonthly(a)>0).map(m=>({id:m.id,cat:mortCat(m),monthly:mortMonthly(m),name:m.name}));
  S.accounts.filter(p=>p.kind==='property'&&p.rental&&p.mortgagePay>0&&!S.accounts.some(m=>m.kind==='mortgage'&&m.propertyId===p.id)).forEach(p=>out.push({id:p.id,cat:'Hipoteca alquiler',monthly:p.mortgagePay,name:p.name}));
  return out;
}
function cashflowByMonth(){
  const fixed=fixedMortgages(); const fixedCats=new Set(fixed.map(f=>f.cat));
  const map={};
  for(const t of S.tx){ const k=ym(t.date); const ty=catType(t.cat); if(ty==='neutral') continue; map[k]=map[k]||{income:0,expense:0,cats:{}};
    if(ty==='income'){ map[k].income+=t.amount; continue; }
    if(fixedCats.has(t.cat)) continue; // se cuenta abajo como cuota fija
    map[k].expense+=-t.amount; map[k].cats[t.cat]=(map[k].cats[t.cat]||0)+(-t.amount); }
  for(const k of Object.keys(map)) for(const f of fixed){ map[k].expense+=f.monthly; map[k].cats[f.cat]=(map[k].cats[f.cat]||0)+f.monthly; }
  return map;
}
function txMonths(){ return [...new Set(S.tx.map(t=>ym(t.date)))].sort(); }
function amortize(balance, ratePct, payment, extra, maxN=600){
  const r=ratePct/100/12; let b=balance, n=0, interest=0; const pts=[{n:0,b}];
  if(payment<=b*r) return {n:Infinity, interest:Infinity, pts};
  while(b>0.005 && n<maxN){ const i=Math.round(b*r*100)/100; let p=payment+extra-i; if(p>b)p=b; b-=p; interest+=i; n++; pts.push({n,b}); }
  return {n, interest, pts};
}
function addMonths(dateStr, n){ const d=new Date(dateStr+'T12:00:00'); d.setDate(1); d.setMonth(d.getMonth()+n); return MESL[d.getMonth()]+' '+d.getFullYear(); }
function nextPaymentDate(m){ return m.nextDue || today(); }
function categorize(desc){
  const D=' '+String(desc||'').toUpperCase()+' ';
  for(const r of S.rules){ try{ if(new RegExp(r.pattern,'i').test(D)) return r.cat; }catch(e){} }
  return null;
}

/* ============================================================
   Conciliación entre cuentas
   Empareja los movimientos que son la misma operación vista desde dos cuentas
   (pago de tarjeta, transferencia propia, cuota de hipoteca), corrige su categoría
   para no contar dos veces el gasto y comprueba que saldos y movimientos cuadren.
   Cada movimiento emparejado lleva t.rec={type:'card'|'xfer'|'mortgage', acc, with?, prev?, cat?}.
   Si el usuario cambió la categoría a mano (t.manual), no se toca.
   ============================================================ */
const MORT_CATS=['Hipoteca casa','Hipoteca alquiler'];
const CARD_PAY_RE=/PAYMENT|PYMT|PMT|AUTOPAY|AUTO PAY|THANK YOU|EPAY|CRCARDPMT|PAGO/i;
const CARD_HINT_RE=/CARD|CRD|AMEX|AMERICAN EXPRESS|DISCOVER|CAPITAL ONE|CITI|VISA|MASTERCARD|EPAY|AUTOPAY|CRCARDPMT/i;
const XFER_RE=/TRANSFER|XFER|TRANSF|ONLINE|FROM |TO |SAVINGS|CHECKING|ZELLE|INTERNAL|MOBILE/i;
const MORT_RE=/MORTGAGE|MTG|MTGE|HOME LOAN|LOAN PMT|LOAN PAYMENT|HIPOTECA/i;
const r2=x=>Math.round(x*100)/100;
function mortCat(m){ return isRentalMortgage(m)?'Hipoteca alquiler':'Hipoteca casa'; }
function mortMonthly(m){ return r2((m.payment||0)+(m.escrow||0)+(m.extra||0)); }
function instWord(a){ const w=String(a&&a.institution||'').toUpperCase().match(/[A-Z0-9]{3,}/); return w?w[0]:null; }
function mentions(t,a){ if(!a) return false; const D=' '+String(t.desc||'').toUpperCase()+' '; const w=instWord(a); if(w&&D.includes(w)) return true; return !!(a.last4&&a.last4.length===4&&new RegExp('\\D'+a.last4+'\\D').test(D)); }
function hashKey(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return (h>>>0).toString(36); }
let REC=null;
function lastRec(){ return REC||reconcile(); }
function reconcile(){
  if(!S) return null;
  const sig=()=>S.tx.map(t=>t.cat+(t.rec?'|'+t.rec.type+t.rec.acc+(t.rec.with||''):'')).join(',');
  const before=sig();
  const cashIds=new Set(S.accounts.filter(a=>a.kind==='cash').map(a=>a.id));
  const cardIds=new Set(S.accounts.filter(a=>a.kind==='credit').map(a=>a.id));
  const byId={}; S.tx.forEach(t=>byId[t.id]=t);
  // 1) Deshacer los emparejamientos anteriores (devolviendo la categoría que tenían)
  for(const t of S.tx){ if(!t.rec) continue; if(!t.manual&&t.rec.cat&&t.cat===t.rec.cat&&t.rec.prev) t.cat=t.rec.prev; delete t.rec; }
  const link=(t,rec,cat)=>{ t.rec=rec; if(cat&&!t.manual&&t.cat!==cat){ rec.prev=t.cat; rec.cat=cat; t.cat=cat; } };
  const used=new Set(); const stats={card:0,xfer:0,mort:0};
  // 2) Pagos de tarjeta y transferencias: salida en una cuenta = entrada en otra, mismo importe, ±días
  const inAcc=t=>t.acc&&(cashIds.has(t.acc)||cardIds.has(t.acc));
  const byAmt={}; S.tx.forEach(t=>{ if(t.amount>0&&inAcc(t)){ const k=Math.round(t.amount*100); (byAmt[k]=byAmt[k]||[]).push(t); } });
  const cand=[];
  for(const o of S.tx){ if(!(o.amount<0&&inAcc(o))) continue; const list=byAmt[Math.round(-o.amount*100)]; if(!list) continue;
    for(const i of list){ if(i.acc===o.acc) continue; const dd=daysBetween(o.date,i.date); if(dd<-3||dd>7) continue;
      if(catType(i.cat)==='income'&&i.cat!=='Otros ingresos') continue; // nómina, renta… no son transferencias
      let score=10-Math.abs(dd); const toCard=cardIds.has(i.acc);
      if(toCard){ const card=acc(i.acc); if(!(CARD_PAY_RE.test(i.desc)||mentions(o,card)||CARD_HINT_RE.test(o.desc)||o.cat==='Pago tarjeta')) continue; if(mentions(o,card)) score+=5; if(CARD_PAY_RE.test(i.desc)) score+=2; }
      else { if(!(XFER_RE.test(o.desc)||XFER_RE.test(i.desc)||o.cat==='Transferencia'||i.cat==='Transferencia')) continue; if(mentions(o,acc(i.acc))||mentions(i,acc(o.acc))) score+=5; }
      cand.push({o,i,score,type:toCard?'card':'xfer'}); } }
  cand.sort((a,b)=>b.score-a.score);
  for(const c of cand){ if(used.has(c.o.id)||used.has(c.i.id)) continue; used.add(c.o.id); used.add(c.i.id);
    const cat=c.type==='card'?'Pago tarjeta':'Transferencia';
    link(c.o,{type:c.type,acc:c.i.acc,with:c.i.id},cat); link(c.i,{type:c.type,acc:c.o.acc,with:c.o.id},cat); stats[c.type]++; }
  // 3) Cuotas de hipoteca pagadas desde las cuentas de banco: por importe exacto y/o nombre de la entidad
  const morts=S.accounts.filter(a=>a.kind==='mortgage'&&mortMonthly(a)>0);
  const mres={}; morts.forEach(m=>mres[m.id]={pays:[],accs:new Set()});
  if(morts.length) for(const t of S.tx){ if(!(t.amount<0&&t.acc&&cashIds.has(t.acc)&&!used.has(t.id))) continue; const a=-t.amount; let best=null;
    for(const m of morts){ const exp=mortMonthly(m); const exact=[exp,r2((m.payment||0)+(m.escrow||0))].some(v=>Math.abs(a-v)<0.015);
      const named=mentions(t,m)||MORT_RE.test(t.desc)||MORT_CATS.includes(t.cat); const near=Math.abs(a-exp)/exp;
      let sc=0; if(exact&&named) sc=100; else if(exact&&a>=300) sc=60; else if(named&&near<=0.25) sc=40-near*100;
      if(sc>0&&(!best||sc>best.sc)) best={m,sc}; }
    if(best){ used.add(t.id); link(t,{type:'mortgage',acc:best.m.id},mortCat(best.m)); mres[best.m.id].pays.push(t); mres[best.m.id].accs.add(t.acc); stats.mort++; } }
  // 4) Comprobaciones
  const issues=[]; const ign=new Set(S.settings.recIgnore||[]);
  const add=(key,lvl,t,det,acts)=>{ if(!ign.has(key)) issues.push({key,lvl,t,det,acts}); };
  const line=t=>`${dLabel(t.date)} · ${esc(t.desc)} · ${fmt(t.amount,2)} · ${esc(accName(t.acc))}`;
  const cutoff=new Date(Date.now()-365*864e5).toISOString().slice(0,10);
  const span=ids=>{ const ds=S.tx.filter(t=>ids.has(t.acc)).map(t=>t.date).sort(); return ds.length?[ds[0],ds[ds.length-1]]:null; };
  // 4a) Pagos de tarjeta desde el banco sin la tarjeta correspondiente
  const lone=S.tx.filter(t=>t.acc&&cashIds.has(t.acc)&&t.cat==='Pago tarjeta'&&!t.rec&&t.date>=cutoff).sort((a,b)=>b.date.localeCompare(a.date));
  if(lone.length){ const tot=lone.reduce((s,t)=>s-t.amount,0);
    add('cardpay:'+hashKey(lone.map(t=>t.id).join()),'warn',`<b>${lone.length} pago${lone.length>1?'s':''} de tarjeta (${fmt(tot)}) sin sus movimientos.</b> Los pagos a la tarjeta no cuentan como gasto, así que si no importas los movimientos de esa tarjeta, sus compras no aparecen en tus gastos. Importa su CSV o PDF del mismo periodo.`,lone.slice(0,20).map(line)); }
  // 4b) Pagos recibidos en la tarjeta sin el cargo en el banco (cuando el banco sí cubre esas fechas)
  const cs=span(cashIds);
  if(cs){ const orph=S.tx.filter(t=>t.acc&&cardIds.has(t.acc)&&t.amount>0&&!t.rec&&(t.cat==='Pago tarjeta'||CARD_PAY_RE.test(t.desc))&&t.date>=cs[0]&&t.date<=cs[1]);
    if(orph.length) add('cardorph:'+hashKey(orph.map(t=>t.id).join()),'info',`<b>${orph.length} pago${orph.length>1?'s':''} a tus tarjetas sin el cargo en el banco.</b> Probablemente se pagaron desde una cuenta que no has importado, o el importe no coincide.`,orph.slice(0,20).map(line)); }
  // 4c) Hipotecas: cuotas que faltan y cuota distinta de la del extracto
  for(const m of morts){ const r=mres[m.id]; const exp=mortMonthly(m); r.exp=exp;
    const ps=r.pays.slice().sort((a,b)=>a.date.localeCompare(b.date)); r.last=ps[ps.length-1]||null;
    if(!ps.length) continue; const sp=span(r.accs); const gaps=[];
    const pts=[sp[0],...ps.map(t=>t.date),sp[1]];
    for(let i=1;i<pts.length;i++){ const d=daysBetween(pts[i-1],pts[i]); const lim=(i===1||i===pts.length-1)?40:45; if(d>lim) gaps.push(`Entre el ${dLabel(pts[i-1])} y el ${dLabel(pts[i])} (${Math.round(d/30.4)} mes${Math.round(d/30.4)>1?'es':''})`); }
    if(gaps.length) add('mgap:'+m.id+':'+hashKey(gaps.join()),'warn',`<b>${esc(m.name)}: no encuentro ${gaps.length>1?'algunas cuotas':'una cuota'} en tus cuentas.</b> Puede que esos meses se pagara desde otra cuenta o que falte importar movimientos. Para el gasto mensual se cuenta igualmente la cuota fija de ${fmt(exp,2)}.`,gaps);
    const L=r.last; const paid=-L.amount;
    if(Math.abs(paid-exp)>1&&Math.abs(paid-r2((m.payment||0)+(m.escrow||0)))>1) add('mamt:'+m.id+':'+L.id,'warn',`<b>${esc(m.name)}: la última cuota pagada (${fmt(paid,2)} el ${dLabel(L.date)}) no coincide con la del extracto (${fmt(exp,2)} = cuota ${fmt(m.payment||0,2)}${m.escrow?' + escrow '+fmt(m.escrow,2):''}${m.extra?' + extra '+fmt(m.extra,2):''}).</b> Si cambió el escrow o el pago extra, importa el último extracto o edita la hipoteca.`); }
  // 4d) Saldo de la hipoteca entre dos extractos frente a lo que debería haber bajado
  for(const m of S.accounts.filter(a=>a.kind==='mortgage')){ const sn=S.snapshots.filter(s=>s.acc===m.id).sort((a,b)=>a.date.localeCompare(b.date));
    for(let i=1;i<sn.length;i++){ const s1=sn[i-1], s2=sn[i]; const k=Math.round(daysBetween(s1.date,s2.date)/30.44); if(k<1||k>3) continue;
      const rate=s1.rate??m.rate, pi=s1.pi??m.payment, ex=s1.extra??m.extra??0; if(!rate||!pi) continue;
      let b=s1.value; for(let j=0;j<k&&b>0;j++){ const int=r2(b*rate/1200); b=Math.max(0,r2(b-(pi+ex-int))); }
      const diff=r2(s2.value-b); if(Math.abs(diff)<=5) continue;
      add('mbal:'+s2.id+':'+s2.value,s2.value>s1.value?'crit':'warn',`<b>${esc(m.name)}: el saldo no cuadra entre extractos.</b> Del ${dLabel(s1.date)} (${fmt(s1.value,2)}) al ${dLabel(s2.date)} (${fmt(s2.value,2)}) debería haber bajado a unos ${fmt(b,2)} con ${k} cuota${k>1?'s':''} de ${fmt(pi,2)} + ${fmt(ex,2)} extra. Diferencia: ${fmt(Math.abs(diff),2)} ${diff>0?'más de lo esperado (¿cuota no aplicada, extra menor o algún cargo?)':'menos de lo esperado (¿pago extra mayor?)'}.`); } }
  // 4e) Bancos y tarjetas: el cambio de saldo entre dos extractos debe ser la suma de los movimientos
  for(const a of S.accounts.filter(x=>x.kind==='cash'||x.kind==='credit')){ const txs=S.tx.filter(t=>t.acc===a.id); if(!txs.length) continue;
    const ds=txs.map(t=>t.date).sort(); const sn=S.snapshots.filter(s=>s.acc===a.id).sort((x,y)=>x.date.localeCompare(y.date));
    for(let i=1;i<sn.length;i++){ const s1=sn[i-1], s2=sn[i]; if(daysBetween(s1.date,ds[0])>7||daysBetween(ds[ds.length-1],s2.date)>7) continue; // los movimientos deben cubrir el periodo
      const inR=txs.filter(t=>t.date>s1.date&&t.date<=s2.date); if(!inR.length) continue;
      const sum=r2(inR.reduce((s,t)=>s+t.amount,0)); const delta=r2((s2.value-s1.value)*(a.kind==='credit'?-1:1)); const diff=r2(delta-sum); if(Math.abs(diff)<=1) continue;
      add('bal:'+s2.id+':'+hashKey(String(s1.value)+s2.value+sum),'warn',`<b>${esc(a.name)}: saldo y movimientos no cuadran.</b> Del ${dLabel(s1.date)} al ${dLabel(s2.date)} el saldo ${a.kind==='credit'?'pendiente ':''}pasó de ${fmt(s1.value,2)} a ${fmt(s2.value,2)}, pero los ${inR.length} movimientos suman ${fmt(sum*(a.kind==='credit'?-1:1),2)}. Diferencia: ${fmt(Math.abs(diff),2)}. ${diff<0?'Puede que algún movimiento esté duplicado':'Puede que falte algún movimiento'}, o que uno cerca de la fecha de cierre esté en otro periodo.`); } }
  // 4f) Posibles duplicados: misma cuenta e importe, ±3 días, importados de fuentes distintas (CSV y PDF)
  const groups={}; S.tx.forEach(t=>{ if(!t.acc) return; const k=t.acc+'|'+Math.round(t.amount*100); (groups[k]=groups[k]||[]).push(t); });
  const norm=s=>String(s||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,12);
  for(const g of Object.values(groups)){ if(g.length<2) continue; g.sort((a,b)=>a.date.localeCompare(b.date));
    for(let i=0;i<g.length;i++) for(let j=i+1;j<g.length;j++){ const x=g[i], y=g[j]; if(daysBetween(x.date,y.date)>3) break;
      if(!((x.src&&y.src&&x.src!==y.src&&x.src!=='manual'&&y.src!=='manual')||(x.date===y.date&&norm(x.desc)===norm(y.desc)))) continue;
      const dupe=(y.src==='pdf'||x.src!=='pdf')?y:x;
      add('dup:'+[x.id,y.id].sort().join(':'),'warn',`<b>Posible movimiento duplicado</b> en ${esc(accName(x.acc))}: ${fmt(x.amount,2)} el ${dLabel(x.date)}${x.date!==y.date?' y el '+dLabel(y.date):''} (${esc(x.desc)} / ${esc(y.desc)}).`,null,[{id:'del:'+dupe.id,l:'Borrar el duplicado',cls:'dan'}]); } }
  const order={crit:0,warn:1,info:2}; issues.sort((a,b)=>order[a.lvl]-order[b.lvl]);
  REC={stats,issues,mort:mres,changed:sig()!==before};
  return REC;
}
function recLabel(t){ if(!t.rec) return ''; const o=accName(t.rec.acc); return t.rec.type==='mortgage'?`↔ cuota de ${o}`:t.rec.type==='card'?(t.amount<0?`↔ pago a ${o}`:`↔ pagado desde ${o}`):(t.amount<0?`↔ a ${o}`:`↔ desde ${o}`); }
function recHTML(R){
  const s=R.stats; const pl=(n,a,b)=>n+' '+(n===1?a:b);
  const ic={good:'✓',warn:'!',crit:'!',info:'i'};
  return `<p class="sub">Emparejados entre cuentas: ${pl(s.card,'pago de tarjeta','pagos de tarjeta')}, ${pl(s.xfer,'transferencia','transferencias')} y ${pl(s.mort,'cuota','cuotas')} de hipoteca. Los pagos de tarjeta y las transferencias no cuentan como gasto (ya cuentan las compras); la hipoteca cuenta como cuota fija mensual.</p>`+
   (R.issues.length?R.issues.map(i=>`<div class="alert ${i.lvl}"><span class="ic">${ic[i.lvl]}</span><div style="flex:1">${i.t}${i.det&&i.det.length?`<details style="margin-top:4px"><summary>Ver detalle (${i.det.length})</summary>${i.det.map(d=>`<div class="muted">${d}</div>`).join('')}</details>`:''}<div class="row" style="margin-top:6px;justify-content:flex-start">${(i.acts||[]).map(a=>`<button class="sm ${a.cls||''}" data-ract="${esc(a.id)}">${a.l}</button>`).join('')}<button class="sm" data-rign="${esc(i.key)}">${i.key.startsWith('dup:')?'No es duplicado':'Ignorar'}</button></div></div></div>`).join('')
   :'<div class="alert good"><span class="ic">✓</span><div><b>Todo cuadra.</b> No hay diferencias entre tus cuentas.</div></div>');
}
function wireRec(el){

/* ============================================================
   Charts — hand-built SVG with hover tooltips
   ============================================================ */
const tip=$('#tip');
function showTip(html, x, y){ tip.innerHTML=html; tip.style.opacity=1; const w=tip.offsetWidth, h=tip.offsetHeight; let L=x+14, T=y-h-10; if(L+w>window.innerWidth-8) L=x-w-14; if(T<8) T=y+14; tip.style.left=L+window.scrollX+'px'; tip.style.top=T+window.scrollY+'px'; tip.style.position='absolute'; }
function hideTip(){ tip.style.opacity=0; }
function niceTicks(min,max,count=4){ if(min===max){max=min+1;} const span=max-min; const step0=span/count; const mag=Math.pow(10,Math.floor(Math.log10(step0))); const f=step0/mag; const step=(f<1.5?1:f<3?2:f<7?5:10)*mag; const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step; const t=[]; for(let v=lo; v<=hi+step/2; v+=step) t.push(+v.toFixed(10)); return t; }

function lineChart(el, {labels, series, height=220, yFmt=fmtK, tipLabel=l=>l, zero=false}){
  el.classList.add('chart');
  const W=Math.max(el.clientWidth||600, 280), H=height, P={l:52,r:14,t:10,b:24};
  const vals=series.flatMap(s=>s.values.filter(v=>v!=null));
  if(!vals.length){ el.innerHTML='<div class="empty">Sin datos todavía</div>'; return; }
  let mn=Math.min(...vals), mx=Math.max(...vals); if(zero) mn=Math.min(0,mn); const pad=(mx-mn)*0.08||Math.abs(mx)*0.1||1; if(!zero) mn-=pad; mx+=pad;
  const ticks=niceTicks(mn,mx); mn=ticks[0]; mx=ticks[ticks.length-1];
  const X=i=>P.l+(labels.length===1?(W-P.l-P.r)/2:i*(W-P.l-P.r)/(labels.length-1)); const Y=v=>P.t+(H-P.t-P.b)*(1-(v-mn)/(mx-mn));
  let s=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img"><g class="grid">`;
  ticks.forEach(t=>{ s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${P.l-8}" y="${Y(t)+4}" text-anchor="end">${yFmt(t)}</text>`; });
  s+='</g>';
  const every=Math.ceil(labels.length/Math.max(2,Math.floor((W-P.l)/70)));
  labels.forEach((l,i)=>{ if(i%every===0||i===labels.length-1) s+=`<text x="${X(i)}" y="${H-6}" text-anchor="middle">${esc(l)}</text>`; });
  series.forEach(se=>{ let d='',pen=false; se.values.forEach((v,i)=>{ if(v==null){pen=false;return;} d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1); pen=true; }); s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${se.dash?'stroke-dasharray="5 4"':''}/>`;
    se.values.forEach((v,i)=>{ if(v!=null&&se.values[i-1]==null&&se.values[i+1]==null) s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="${se.color}"/>`; }); });
  s+=`<line class="xh" x1="0" x2="0" y1="${P.t}" y2="${H-P.b}" stroke="var(--muted)" stroke-width="1" opacity="0"/>`;
  series.forEach((se,k)=>{ s+=`<circle class="dot${k}" r="4.5" fill="${se.color}" stroke="var(--surface)" stroke-width="2" opacity="0"/>`; });
  s+=`<rect x="${P.l}" y="0" width="${W-P.l-P.r}" height="${H}" fill="transparent" class="hit"/></svg>`;
  el.innerHTML=s;
  const svg=el.querySelector('svg'), xh=svg.querySelector('.xh');
  const move=e=>{ const r=svg.getBoundingClientRect(); const px=(e.touches?e.touches[0].clientX:e.clientX)-r.left; const sx=px*W/r.width; let i=Math.round((sx-P.l)/((W-P.l-P.r)/Math.max(1,labels.length-1))); i=Math.max(0,Math.min(labels.length-1,i));
    xh.setAttribute('x1',X(i)); xh.setAttribute('x2',X(i)); xh.setAttribute('opacity',1);
    let h=`<b>${esc(tipLabel(labels[i]))}</b>`; series.forEach((se,k)=>{ const c=svg.querySelector('.dot'+k); const v=se.values[i]; if(v==null){c.setAttribute('opacity',0);return;} c.setAttribute('cx',X(i)); c.setAttribute('cy',Y(v)); c.setAttribute('opacity',1); h+=`<br><span class="k" style="background:${se.color}"></span>${esc(se.name)}: ${fmt(v)}`; });
    showTip(h,(e.touches?e.touches[0].clientX:e.clientX),(e.touches?e.touches[0].clientY:e.clientY)); };
  const out=()=>{ xh.setAttribute('opacity',0); series.forEach((se,k)=>svg.querySelector('.dot'+k).setAttribute('opacity',0)); hideTip(); };
  const hit=svg.querySelector('.hit'); hit.addEventListener('mousemove',move); hit.addEventListener('touchstart',move,{passive:true}); hit.addEventListener('touchmove',move,{passive:true}); hit.addEventListener('mouseleave',out); hit.addEventListener('touchend',()=>setTimeout(out,1500));
}

function barChart(el,{labels, series, height=220, yFmt=fmtK, tipLabel=l=>l}){
  el.classList.add('chart');
  const W=Math.max(el.clientWidth||600,280), H=height, P={l:52,r:8,t:10,b:24};
  const vals=series.flatMap(s=>s.values); if(!vals.length||vals.every(v=>!v)){ el.innerHTML='<div class="empty">Sin movimientos todavía</div>'; return; }
  const ticks=niceTicks(Math.min(0,...vals),Math.max(0,...vals)); const mn=ticks[0], mx=ticks[ticks.length-1];
  const Y=v=>P.t+(H-P.t-P.b)*(1-(v-mn)/(mx-mn));
  const gw=(W-P.l-P.r)/labels.length; const n=series.length; const bw=Math.max(4,Math.min(26,(gw*0.72-(n-1)*2)/n));
  let s=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img"><g class="grid">`;
  ticks.forEach(t=>{ s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${P.l-8}" y="${Y(t)+4}" text-anchor="end">${yFmt(t)}</text>`; }); s+='</g>';
  const every=Math.ceil(labels.length/Math.max(2,Math.floor((W-P.l)/52)));
  labels.forEach((l,i)=>{ const cx=P.l+gw*i+gw/2; const x0=cx-(n*bw+(n-1)*2)/2;
    series.forEach((se,k)=>{ const v=se.values[i]||0; if(!v) return; const x=x0+k*(bw+2); const y1=Y(Math.max(v,0)), y2=Y(Math.min(v,0)); const h=Math.max(1,y2-y1); const r=Math.min(4,bw/2,h);
      const path = v>=0 ? `M${x} ${y2}V${y1+r}Q${x} ${y1} ${x+r} ${y1}H${x+bw-r}Q${x+bw} ${y1} ${x+bw} ${y1+r}V${y2}Z` : `M${x} ${y1}V${y2-r}Q${x} ${y2} ${x+r} ${y2}H${x+bw-r}Q${x+bw} ${y2} ${x+bw} ${y2-r}V${y1}Z`;
      s+=`<path d="${path}" fill="${se.color}"/>`; });
    s+=`<rect x="${P.l+gw*i}" y="0" width="${gw}" height="${H-P.b}" fill="transparent" data-i="${i}" class="hit"/>`;
    if(i%every===0) s+=`<text x="${cx}" y="${H-6}" text-anchor="middle">${esc(l)}</text>`; });
  s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)" stroke-width="1"/></svg>`;
  el.innerHTML=s;
  el.querySelectorAll('.hit').forEach(r=>{ const f=e=>{ const i=+r.dataset.i; let h=`<b>${esc(tipLabel(labels[i]))}</b>`; series.forEach(se=>h+=`<br><span class="k" style="background:${se.color}"></span>${esc(se.name)}: ${fmt(se.values[i]||0)}`); showTip(h,(e.touches?e.touches[0].clientX:e.clientX),(e.touches?e.touches[0].clientY:e.clientY)); r.setAttribute('fill','rgba(128,128,128,.08)'); };
    r.addEventListener('mousemove',f); r.addEventListener('touchstart',f,{passive:true}); r.addEventListener('mouseleave',()=>{hideTip();r.setAttribute('fill','transparent')}); r.addEventListener('touchend',()=>setTimeout(()=>{hideTip();r.setAttribute('fill','transparent')},1500)); });
}
function hbars(items, color='var(--s1)'){
  if(!items.length) return '<div class="empty">Sin datos</div>';
  const mx=Math.max(...items.map(i=>i.v));
  return '<div class="hb">'+items.map(i=>`<div>${esc(i.k)}</div><div class="bar"><span style="width:${(i.v/mx*100).toFixed(1)}%;background:${i.c||color}"></span></div><div class="v">${fmt(i.v)}${i.note?` <span class="muted">${i.note}</span>`:''}</div>`).join('')+'</div>';
}
function legend(items){ return '<div class="legend">'+items.map(i=>`<span><i style="background:${i.c}${i.dash?';height:2px;border-radius:0;vertical-align:3px':''}"></i>${esc(i.n)}</span>`).join('')+'</div>'; }

/* ============================================================
   Alerts — computed locally
   ============================================================ */
function computeAlerts(){
  const A=[];
  if(!S.accounts.length){ A.push({lvl:'info',t:'<b>Empieza añadiendo tus cuentas</b> en "Cuentas", o importa un statement en "Importar".'}); return A; }
  const lb=S.settings.lastBackup; const dataAge=daysBetween(S.created,new Date().toISOString());
  if(!lb && (S.tx.length||S.snapshots.length) ) A.push({lvl:'crit',t:'<b>No tienes copia de seguridad.</b> Los datos solo viven en este navegador: si se borra, se pierden. Haz una en "Copia y ajustes".'});
  else if(lb && daysBetween(lb,new Date().toISOString())>30) A.push({lvl:'warn',t:`<b>Tu última copia tiene ${daysBetween(lb,new Date().toISOString())} días.</b> Haz una nueva en "Copia y ajustes".`});
  // stale balances
  const stale=S.accounts.filter(a=>{const s=lastSnap(a.id); return !s || daysBetween(s.date,today())>40;});
  if(stale.length) A.push({lvl:'warn',t:`<b>Saldos por actualizar:</b> ${stale.slice(0,4).map(a=>esc(a.name)).join(', ')}${stale.length>4?` y ${stale.length-4} más`:''}.`});
  // conciliación entre cuentas
  const RC=lastRec(); const rn=RC?RC.issues.filter(i=>i.lvl!=='info'):[];
  if(rn.length) A.push({lvl:rn.some(i=>i.lvl==='crit')?'crit':'warn',t:`<b>Conciliación: ${rn.length} diferencia${rn.length>1?'s':''} entre tus cuentas.</b> Revísala${rn.length>1?'s':''} en <a href="#flujo">Ingresos y gastos</a>.`});
  // cashflow
  const cf=cashflowByMonth(); const ms=Object.keys(cf).sort();
  const cur=ym(today()); const complete=ms.filter(m=>m<cur);
  if(complete.length){ const last=complete[complete.length-1]; const c=cf[last]; const net=c.income-c.expense;
    if(net<0) A.push({lvl:'crit',t:`<b>En ${ymLabel(last)} gastaste más de lo que ingresaste</b> (${fmt(net)}).`});
    else A.push({lvl:'good',t:`<b>${ymLabel(last)}: ahorraste ${fmt(net)}</b> (${c.income>0?Math.round(net/c.income*100):0}% de tus ingresos).`});
    const prev=complete.slice(-4,-1);
    if(prev.length>=2){ const cats=Object.keys(c.cats); cats.forEach(k=>{ const avg=prev.reduce((s,m)=>s+(cf[m].cats[k]||0),0)/prev.length; if(avg>150 && c.cats[k]>avg*1.35 && c.cats[k]-avg>150) A.push({lvl:'warn',t:`<b>${esc(k)} subió</b> a ${fmt(c.cats[k])} en ${ymLabel(last)}, frente a una media de ${fmt(avg)}.`}); }); }
  }
  // emergency fund
  const cash=S.accounts.filter(a=>a.kind==='cash').reduce((s,a)=>s+(balanceOf(a)||0),0);
  const lastN=complete.slice(-3); const avgExp=lastN.length?lastN.reduce((s,m)=>s+cf[m].expense,0)/lastN.length:0;
  if(avgExp>0){ const months=cash/avgExp; const tgt=S.settings.emergencyMonths; if(months<tgt) A.push({lvl:months<3?'crit':'warn',t:`<b>Fondo de emergencia: ${months.toFixed(1)} meses</b> de gastos en liquidez (objetivo ${tgt}). Te faltan unos ${fmt(tgt*avgExp-cash)}.`}); else A.push({lvl:'good',t:`<b>Fondo de emergencia cubierto:</b> ${months.toFixed(1)} meses de gastos en liquidez.`}); }
  // credit cards
  const cc=S.accounts.filter(a=>a.kind==='credit'&&(balanceOf(a)||0)>0);
  cc.forEach(a=>{ if(a.apr && a.apr>0) A.push({lvl:'warn',t:`<b>${esc(a.name)}</b> tiene ${fmt(balanceOf(a))} pendientes al ${a.apr}% APR. Pagarla entera cada mes evita intereses.`}); });
  // rental
  S.accounts.filter(a=>a.kind==='property'&&a.rental).forEach(p=>{ const r=rentalPL(p); if(r.net<0) A.push({lvl:'warn',t:`<b>${esc(p.name)}</b> pierde unos ${fmt(-r.net)} al mes con las cifras configuradas.`}); });
  return A;
}
function alertsHTML(A){ const ic={good:'✓',warn:'!',crit:'!',info:'i'}; return A.map(a=>`<div class="alert ${a.lvl}"><span class="ic">${ic[a.lvl]}</span><div>${a.t}</div></div>`).join(''); }

/* ---------- Noticias (terminal) ----------
   Titulares públicos que recoge cada hora .github/workflows/noticias.yml (rama `news`).
   La descarga es la misma para todo el mundo: tus posiciones nunca salen del dispositivo;
   el filtro "Mi cartera" se hace aquí, en el navegador. */
function newsURL(){ const h=location.hostname; let owner='Marcos86GO', repo='MyFinZen';
  if(/\.github\.io$/i.test(h)){ owner=h.split('.')[0]; const seg=location.pathname.split('/').filter(Boolean)[0]; repo=seg&&!/\.html$/.test(seg)?seg:owner+'.github.io'; }
  return `https://raw.githubusercontent.com/${owner}/${repo}/news/news.json`; }
const NEWS={data:null,at:0,err:'',loading:null,q:'',tk:'all',limit:120};
const NEWS_TABS=[['cartera','Mi cartera'],['global','Global'],['us','EE. UU.'],['eu','Europa'],['es','España'],['paises','Países']];
const NEWS_AMBIG=new Set(['Target','Block','Strategy','Square','Booking','Arm','Shell','Visa','Southern Company','Meta']);
const NEWS_WORDS=new Set(['NOW','MAIN','NET','LOW','COST','ARM','CAT','ALL','ARE','FOR','BIG','CAN','HAS','KEY','PLAY','HOOD','TAN','DIA','ONE','NEW','BIL','FAST','LIFE','REAL','SAFE','SEE','WELL','TEAM','TRUE','CASH','GOOD','BEST','OPEN','EAT','FUN','GO']);
async function loadNews(force){
  if(NEWS.loading) return NEWS.loading;
  if(!force&&NEWS.data&&Date.now()-NEWS.at<10*60000) return NEWS.data;
  NEWS.loading=(async()=>{ try{ const r=await fetch(newsURL()+(force?'?t='+Date.now():''),{cache:force?'reload':'default',credentials:'omit',referrerPolicy:'no-referrer'});
      if(!r.ok) throw new Error(r.status===404?'todavía no hay noticias publicadas':'HTTP '+r.status);
      const d=await r.json(); if(!d||!Array.isArray(d.items)) throw new Error('formato desconocido');
      d.items=d.items.filter(x=>x&&typeof x.t==='string'&&/^https?:\/\//i.test(x.u||'')); NEWS.data=d; NEWS.at=Date.now(); NEWS.err=''; }
    catch(e){ NEWS.err=navigator.onLine===false?'sin conexión':String(e.message||e); }
    finally{ NEWS.loading=null; } return NEWS.data; })();
  return NEWS.loading;
}
function newsSettings(){ const st=S.settings; st.newsTab=st.newsTab||'cartera'; st.newsCountries=Array.isArray(st.newsCountries)?st.newsCountries:['gb','de','mx','jp']; st.newsHide=Array.isArray(st.newsHide)?st.newsHide:[]; return st; }
function myPositions(){ const m=new Map();
  S.accounts.filter(a=>a.holdings&&a.holdings.rows).forEach(a=>a.holdings.rows.forEach(x=>{ const s=String(x.sym||'').toUpperCase().trim(); if(!s) return; const o=m.get(s)||{s,name:x.name||'',value:0}; o.value+=x.value||0; if(!o.name&&x.name) o.name=x.name; m.set(s,o); }));
  return [...m.values()].sort((a,b)=>b.value-a.value); }
function newsMatcher(pos,uni){ const U=new Map((uni||[]).map(u=>[u.s,u]));
  return pos.map(p=>{ const u=U.get(p.s)||U.get(p.s.replace('-','.')); const rx=[]; const escR=t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    if(p.s.length>=3&&!NEWS_WORDS.has(p.s)) rx.push(new RegExp('(^|[^A-Za-z0-9$])\\$?'+escR(p.s)+'(?![A-Za-z0-9])'));
    else if(p.s.length>=1) rx.push(new RegExp('\\$'+escR(p.s)+'(?![A-Za-z0-9])|\\('+escR(p.s)+'\\)'));
    const fundy=n=>/\b(ETF|Fund|Trust|Shares|SPDR|iShares|Vanguard|Invesco|Schwab|Index|Portfolio)\b/i.test(n);
    const base=n=>String(n||'').replace(/,?\s+(Inc|Incorporated|Corp|Corporation|Co|Company|Ltd|Limited|plc|PLC|SA|S\.A\.|AG|NV|N\.V\.|Holdings?|Group|Class [A-C]|Cl [A-C]|ADR|Common Stock|Ordinary Shares)\.?\b.*$/,'').trim();
    const names=u&&u.a?u.a:u?(fundy(u.n)?[]:[u.n]):(p.name&&!fundy(p.name)?[base(p.name)]:[]);
    names.filter(n=>(n.length>=4||/^[A-Z&]{2,}$/.test(n))&&!NEWS_AMBIG.has(n)).forEach(n=>rx.push(new RegExp('(^|[^\\p{L}])'+escR(n)+'(?![\\p{L}])','u')));
    return {s:p.s,covered:!!u,rx}; }); }
function newsAgo(iso){ const m=Math.max(0,Math.round((Date.now()-Date.parse(iso))/60000)); if(m<1) return 'ahora'; if(m<60) return 'hace '+m+' min'; const h=Math.round(m/60); if(h<48) return 'hace '+h+' h'; return 'hace '+Math.round(h/24)+' días'; }
function newsTime(iso){ const d=new Date(iso), n=new Date(); const same=d.toDateString()===n.toDateString();
  return same?d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}):String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'); }
function newsRows(st){ const D=NEWS.data; if(!D) return {rows:[],extra:''};
  const hide=new Set(st.newsHide), q=NEWS.q.trim().toLowerCase(); const tab=st.newsTab; const R=new Map((D.regions||[]).map(r=>[r.id,r]));
  let rows=[], extra='';
  if(tab==='cartera'){
    const pos=myPositions(); if(!pos.length) return {rows:[],extra:'',empty:'Sube el CSV de Holdings de M1 en <a href="#importar" style="color:var(--t-amber)">Importar</a> y aquí verás las noticias de cada una de tus posiciones.'};
    const M=newsMatcher(pos,D.universe); const cnt={};
    D.items.forEach(it=>{ const hits=M.filter(m=>(it.k||[]).includes(m.s)||m.rx.some(r=>r.test(it.t))).map(m=>m.s); if(hits.length){ hits.forEach(h=>cnt[h]=(cnt[h]||0)+1); rows.push(Object.assign({},it,{mine:hits})); } });
    if(NEWS.tk!=='all'&&!pos.some(p=>p.s===NEWS.tk)) NEWS.tk='all';
    if(NEWS.tk!=='all') rows=rows.filter(it=>it.mine.includes(NEWS.tk));
    const unc=M.filter(m=>!m.covered).map(m=>m.s);
    extra=`<div class="term-chips"><button class="chip ${NEWS.tk==='all'?'on':''}" data-tk="all">TODAS<i>${pos.length}</i></button>${pos.map(p=>`<button class="chip ${NEWS.tk===p.s?'on':''}" data-tk="${esc(p.s)}" title="${esc(p.name)}">${esc(p.s)}<i>${cnt[p.s]||0}</i></button>`).join('')}</div>`
      +(unc.length?`<div class="term-note">Sin búsqueda propia: ${unc.map(esc).join(', ')}. Solo aparecen si salen en los titulares generales. Para cubrirlos, añádelos a <code>news/universe.json</code> en GitHub (es un archivo público: no incluyas nada que no quieras que se vea).</div>`:'');
  } else if(tab==='paises'){
    const C=(D.regions||[]).filter(r=>r.country); const sel=new Set(st.newsCountries.filter(c=>R.has(c)));
    extra=`<div class="term-chips">${C.map(c=>`<button class="chip ${sel.has(c.id)?'on':''}" data-cty="${c.id}">${esc(c.name)}</button>`).join('')}</div>`;
    rows=D.items.filter(it=>(it.r||[]).some(r=>sel.has(r))).map(it=>Object.assign({},it,{rg:(it.r||[]).filter(r=>sel.has(r))}));
    if(!sel.size) return {rows:[],extra,empty:'Elige uno o varios países.'};
  } else rows=D.items.filter(it=>(it.r||[]).includes(tab));
  rows=rows.filter(it=>!hide.has(it.d)&&(!q||(it.t+' '+it.s+' '+(it.mine||[]).join(' ')).toLowerCase().includes(q)));
  rows.sort((a,b)=>b.p.localeCompare(a.p)); return {rows,extra};
}
function newsRowHTML(it){ const old=Date.now()-Date.parse(it.p)>12*3600e3; const src=esc(it.s||it.d);
  const tags=(it.mine||[]).map(s=>`<span class="tk">${esc(s)}</span>`).join('')+(it.rg||[]).map(r=>`<span class="rg">${esc(r.toUpperCase())}</span>`).join('');
  return `<div class="term-row"><span class="tm ${old?'old':''}" title="${esc(new Date(it.p).toLocaleString('es-ES'))}">${newsTime(it.p)}</span><span class="src2" title="${src}">${src}</span>
    <a class="hl" href="${esc(it.u)}" target="_blank" rel="noopener noreferrer">${esc(it.t)}</a>
    <span class="mt"><span class="src src1">${src}</span><span>${esc(it.d)}</span><span>${newsAgo(it.p)}</span>${tags}</span>
    <button class="x" data-hide="${esc(it.d)}" title="Ocultar ${src}" aria-label="Ocultar las noticias de ${src}">×</button></div>`; }

VIEWS.noticias=(el)=>{

  el.innerHTML=invTabs('noticias')+`<div class="term" id="term"><div class="term-bar"><b>MYFINZEN&nbsp;NEWS</b><span class="st" id="tClock"></span><span class="st sp" id="tState"></span><button id="tRef" title="Actualizar (R)">↻ Actualizar</button></div>

  const body=$('#tBody'), foot=$('#tFoot');
  const clock=()=>{ const c=$('#tClock'); if(!c){ clearInterval(NEWS.clk); return; } c.textContent=new Date().toLocaleString('es-ES',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',timeZoneName:'short'}).toUpperCase(); };
  clearInterval(NEWS.clk); clock(); NEWS.clk=setInterval(clock,30000);

function rentalPL(p){
  const mort=S.accounts.find(a=>a.kind==='mortgage'&&a.propertyId===p.id);
  const mPay=mort?(mort.payment||0)+(mort.escrow||0):(p.mortgagePay||0);
  const rent=p.rent||0, hoa=p.hoa||0, tax=(p.taxYear||0)/12, ins=(p.insYear||0)/12, maint=p.maint||0, other=p.otherMonthly||0;
  const costs=mPay+hoa+tax+ins+maint+other;
  return {rent,mPay,hoa,tax,ins,maint,other,costs,net:rent-costs,mort};
}

function addSnapshot(accId){

function upsertSnap(accId,date,value){ let ex=S.snapshots.find(s=>s.acc===accId&&s.date===date); if(ex) ex.value=value; else S.snapshots.push(ex={id:uid(),acc:accId,date,value}); return ex; }
function showHistory(accId){

   .replace(/[\w.+-]+@[\w-]+\.[\w.]+/g,'[email]').replace(/\(?\b\d{3}\)?[.\- ]\d{3}[.\- ]\d{4}\b/g,'[tel]')
   .replace(/^.*\b\d{2,6}\s+[A-Z][A-Za-z]+(?:\s+[A-Za-z]+){0,3}\s+(WAY|ST|STREET|AVE|AVENUE|RD|ROAD|DR|DRIVE|BLVD|LN|LANE|CT|COURT|PL|PLACE|CIR|CIRCLE|TER|PKWY)\b.*$/gim,'[dirección]')
   .replace(/\b[A-Z]{2}\s+\d{5}(?:-\d{4})?\b/g,'[CP]');
  (S.settings.hideNames||'').split(',').map(x=>x.trim()).filter(x=>x.length>2).forEach(n=>{ s=s.replace(new RegExp(n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),'[nombre]'); });
  return s;
}

async function claudeExtract(text){

  if(!S.settings.autoClaude){
    const ok=await confirmModal('Leer con Claude',`<p>Se enviará a Claude <b>solo el texto</b> del documento, con números de cuenta, SSN, teléfonos, emails, direcciones${S.settings.hideNames?' y los nombres que indicaste':''} ocultos. No se envía el PDF y Claude no lo guarda.</p><details><summary>Ver exactamente lo que se envía</summary><pre>${esc(red.slice(0,4000))}${red.length>4000?'\n…':''}</pre></details><p class="muted">Puedes ocultar también tu nombre en "Copia y ajustes".</p>`);
    if(!ok) return null; }
  const sample=await getSample(); if(!sample) throw new Error('Para usar Claude, añade tu clave de API en Copia y ajustes');
  const prompt=`You extract data from a US financial document (text below, some parts masked with •). Reply ONLY with JSON, no prose:
{"doc_type":"bank_statement"|"credit_card_statement"|"brokerage_statement"|"retirement_statement"|"mortgage_statement"|"tax_form"|"other",

   "fields":{"wages":n,"fedWH":n,"stateWages":n,"stateWH":n,"sdi":n,"k401":n,"interest":n,"principalStart":n,"points":n,"propertyTax":n,"ordinaryDiv":n,"qualifiedDiv":n,"capGainDist":n,"foreignTax":n,"proceeds":n,"stGain":n,"ltGain":n,"gross":n,"taxable":n,"iraContrib":n,"rothContrib":n,"fmv":n,"amount":n}}]}
Rules: amounts negative for money leaving the account (purchases, withdrawals, fees) and positive for deposits/credits/payments received. For credit cards ending_balance is the amount owed (positive). Include ALL transactions listed. In fields include only keys present in the document. A consolidated 1099 yields one entry per form section (1099INT, 1099DIV, 1099B). Use null when unknown.

function isHoldingsCSV(rows){ const h=(rows[0]||[]).map(x=>x.trim().toLowerCase()); return h.includes('symbol')&&h.some(x=>/^(value|market value|current value)$/.test(x))&&h.some(x=>/quantity|shares/.test(x)); }
function parseHoldings(rows){
  const h=rows[0].map(x=>x.trim().toLowerCase()); const ix=re=>h.findIndex(x=>re.test(x));
  const c={sym:ix(/^symbol$/),name:ix(/^name$|description/),qty:ix(/quantity|shares/),avg:ix(/avg/),cost:ix(/cost basis/),gain:ix(/unrealized gain \(\$\)|gain\/loss \(\$\)|unrealized gain$/),val:ix(/^(value|market value|current value)$/)};
  return rows.slice(1).filter(r=>r[c.sym]&&r[c.sym].trim()).map(r=>{ const value=num(r[c.val]), cost=c.cost>=0?num(r[c.cost]):NaN; const gain=c.gain>=0?num(r[c.gain]):(isNaN(cost)?NaN:value-cost);

function expectedDocs(year){
  const ty=taxYear(year); const has=(types,accId)=>ty.docs.some(d=>types.includes(d.type)&&(!accId||d.acc===accId));
  const L=[];
  L.push({k:'W-2 de tu empleador (y de tu esposa si trabajó)',ok:has(['W2']),hint:'Llega a finales de enero'});
  S.accounts.forEach(a=>{
    if(a.kind==='mortgage') L.push({k:`1098 · ${a.name}`,ok:has(['1098'],a.id),hint:'Intereses de hipoteca, llega en enero'});
    if(a.kind==='cash') L.push({k:`1099-INT · ${a.name}`,ok:has(['1099INT','C1099'],a.id),hint:'Solo si ganó más de $10 de intereses',opt:true});
    if(a.kind==='brokerage') L.push({k:`1099 consolidado · ${a.name}`,ok:has(['C1099','1099DIV','1099B','1099INT'],a.id),hint:'Dividendos y ventas; suele llegar a mediados de febrero'});
    if(a.kind==='kids') L.push({k:`1099 · ${a.name}`,ok:has(['C1099','1099DIV','1099B'],a.id),hint:'Si es una cuenta a nombre de los niños (UTMA/UGMA), va en su declaración, no en la tuya',opt:true});
    if(a.kind==='retirement') L.push({k:`5498 / 1099-R · ${a.name}`,ok:has(['5498','1099R'],a.id),hint:'Solo si aportaste a una IRA o retiraste dinero',opt:true});
    if(a.kind==='property') L.push({k:`Impuesto de propiedad · ${a.name}`,ok:has(['PROPTAX'],a.id),hint:'Recibos del condado (pagos de diciembre y abril)'});
  });
  if(!S.accounts.some(a=>a.kind==='property'&&!a.rental)) L.push({k:'Impuesto de propiedad · casa familiar',ok:ty.docs.some(d=>d.type==='PROPTAX'&&!d.acc),hint:'Añade la casa familiar como inmueble en Cuentas, o guarda el recibo sin cuenta',opt:false});
  L.push({k:'Recibos de donativos',ok:has(['CHARITY'])||ty.charity>0,hint:'Iglesia, ONG, colegio…',opt:true});
  L.push({k:'Gastos de guardería o preescolar (Dependent Care FSA / crédito)',ok:!!ty.childcareNoted,hint:'Pide al centro su EIN y el total pagado',opt:true,key:'childcareNoted'});
  return L;
}

    documentos:ty.docs.map(d=>d.type), perfil_familiar:(()=>{const P=prof(year);return {edad_contribuyente:P.age,conyuge_trabaja:P.spouseWorks,ingresos_conyuge:P.spouseIncome,contribuyente_con_401k:P.covered,conyuge_con_plan:P.spouseCovered,hijos_edades_31dic:(P.children||[]).map(c=>c.by?year-c.by:null),hijos_con_ssn:(P.children||[]).map(c=>c.ssn!==false),form4547_presentado:!!P.f4547,seguro_hdhp:P.hdhp,hsa:P.hsa,ofrece_dcfsa:P.dcfsaOffered,gastos_guarderia:P.childcare,ira_tradicional_tu:P.iraYou,ira_tradicional_conyuge:P.iraSpouse,roth:P.roth,aport_529:P.c529,k401:R.k401};})(), cuentas:S.accounts.map(a=>({tipo:KINDS[a.kind].label,saldo:Math.round(balanceOf(a)||0),...(a.kind==='mortgage'?{tipo_interes:a.rate,anterior_dic2017:!!a.pre2017,de_alquiler:isRentalMortgage(a)}:{})})), recomendaciones_ya_calculadas:recommendations(year).map(r=>r.t+(r.save?` (≈$${Math.round(r.save)})`:'')), fecha_hoy:today(), faltan:expectedDocs(year).filter(e=>!e.ok&&!e.opt).map(e=>e.k), contexto:S.settings.context||''};
  const base=`Eres un asistente fiscal experto para un contribuyente de California (EE. UU.). Responde en español, en markdown (#### y viñetas), con cifras concretas basadas en los datos. Año fiscal ${year}. Aplica las reglas federales vigentes tras la ley OBBBA y las de California (incluida su no conformidad: límite de $1M en intereses hipotecarios, HSA tributa en CA). Todo lo que recomiendes debe ser legal; no sugieras nada agresivo ni dudoso. Ten en cuenta la fecha de hoy para distinguir lo que aún se puede hacer este año de lo que ya solo afecta a la declaración.`;
  const tasks={review:'Revisa los datos y dime: 1) qué documentos o datos faltan, 2) errores o incoherencias probables, 3) oportunidades que se están dejando pasar, 4) pasos para preparar la declaración.',
    plan:'Diseña el PLAN ÓPTIMO para pagar legalmente lo mínimo: #### Acciones con fecha límite (ordenadas por ahorro estimado en $, federal + CA), #### Decisiones de la declaración (forma de declarar, estándar vs detallada, cómo tratar el alquiler, créditos por hijos, Trump Account), #### Para el año que viene (beneficios del empleador, W-4, estructura de ahorro de los hijos), #### Riesgos o cosas a confirmar con un profesional. Valida o corrige las recomendaciones ya calculadas y añade las que falten.',
    turbotax:'Escribe una GUÍA PASO A PASO para presentar esta declaración en TurboTax Online Premium (federal + California), con las rutas de menú (en inglés, como aparecen en TurboTax) y QUÉ VALOR introducir en cada pantalla según los datos. Incluye las preguntas difíciles que hará TurboTax (alquiler: participación activa, amortización, pérdidas pasivas; hipoteca por encima de $750k; CA SDI; Form 4547) y cómo responderlas. Termina con una checklist de revisión antes de enviar.'};
  const prompt=`${base}\n\nTAREA: ${tasks[mode]||tasks.review}\n\nAl final, una línea indicando que no eres asesor fiscal y que lo revise un profesional.\n\nDATOS (agregados, sin nombres ni números de cuenta):\n${JSON.stringify(data)}`;
  out.innerHTML='<p class="muted">Pensando…</p>';
  try{ const r=await sample(prompt,{modelTier:'complex',onText:({text})=>{out.innerHTML=md(text);}}); out.innerHTML=md(r.text); }catch(e){ out.innerHTML=`<p class="muted">${esc(e.code==='not_granted'?'No diste permiso para usar Claude.':e.message||'Error')}</p>`; }
}

const LIM={2025:{k401:23500,ira:7000,hsaFam:8550,hsaSelf:4300,dcfsa:5000,iraCov:[126000,146000],iraSpouse:[236000,246000],roth:[236000,246000]},
           2026:{k401:24500,ira:7500,hsaFam:8750,hsaSelf:4400,dcfsa:7500,iraCov:[129000,149000],iraSpouse:[242000,252000],roth:[242000,252000]}};
const CA_BR={MFJ:[[22158,.01],[52528,.02],[82904,.04],[115084,.06],[145448,.08],[742958,.093],[891542,.103],[1485906,.113],[Infinity,.123]],
             S:[[11079,.01],[26264,.02],[41452,.04],[57542,.06],[72724,.08],[371479,.093],[445771,.103],[742953,.113],[Infinity,.123]]};
function prof(year){ const ty=taxYear(year); ty.profile=ty.profile||{children:[]}; return ty.profile; }
function kidsSplit(year){ const P=prof(year); const ch=(P.children||[]).filter(c=>c.by); return {u17:ch.filter(c=>year-c.by<17&&c.ssn!==false).length, o17:ch.filter(c=>year-c.by>=17).length, u13:ch.filter(c=>year-c.by<13).length, trump:ch.filter(c=>c.by>=2025&&c.by<=2028)}; }
function phaseFrac(magi,[lo,hi]){ return magi<=lo?1:magi>=hi?0:(hi-magi)/(hi-lo); }
function caMarginal(year,fs,taxable){ return (CA_BR[fs]||CA_BR.MFJ).find(([top])=>taxable<=top)[1]; }
const fmtD=(v)=>v>=1?fmt(v):'—';

/* ---------- Perfil ---------- */

   </div>
   <div class="card"><h2>Hijos</h2><p class="sub">Año de nacimiento de cada uno. Determina el crédito por hijos, la guardería y la Trump Account.</p>

     <div class="row">${inp('pW',P.estWages,'Salario bruto anual (ya sin 401(k) pre-tax)')}${inp('pK',P.k401,`401(k) pre-tax del año (máx. ${fmt(L.k401)})`)}</div>

   </div>

  const rebindKids=()=>{ $('#kidRows').querySelectorAll('[data-delkid]').forEach(b=>b.onclick=()=>{ readKids(); P.children.splice(+b.dataset.delkid,1); $('#kidRows').innerHTML=P.children.map((c,i)=>kidRow(c,i)).join(''); rebindKids(); }); };
