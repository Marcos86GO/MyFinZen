<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyFinZen</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.anthropic.com https://raw.githubusercontent.com; worker-src 'self' blob:; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)">
<meta name="description" content="Finanzas personales cifradas en tu dispositivo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyFinZen">
<script src="vendor/pdf.min.js"></script>
<script src="help.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f0f2f5; --border:#e4e7ec; --hover:#f3f5f8;
  --text:#101828; --text-2:#475467; --muted:#7a8494;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --good:#12a150; --warn:#f2b01e; --serious:#ec835a; --crit:#d03b3b;
  --good-text:#067a3a; --crit-text:#b42318;
  --good-bg:#ecfdf3; --warn-bg:#fffaeb; --crit-bg:#fef3f2; --info-bg:#eff6ff;
  --accent:#2563eb; --accent-ink:#fff; --accent-soft:#e8efff;
  --radius:16px; --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.07); --shadow-lg:0 12px 32px rgba(16,24,40,.18);
  --top:56px; --side:252px;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#0e1013; --surface:#171a1f; --surface-2:#20242b; --border:#2a2f37; --hover:#1f232a;
    --text:#eef0f3; --text-2:#b8bfca; --muted:#8a93a0;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --good-text:#4ccb7f; --crit-text:#f08b84;
    --good-bg:#0f2a1c; --warn-bg:#2b2410; --crit-bg:#2e1614; --info-bg:#142035;
    --accent:#4f8cf7; --accent-soft:#1a2a47;
    --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 12px 32px rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
/* ---------- Barra superior, menú lateral y botón + ---------- */
.topbar{position:sticky;top:0;z-index:30;height:calc(var(--top) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 8px 0;display:flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.6) blur(12px);-webkit-backdrop-filter:saturate(1.6) blur(12px);border-bottom:1px solid transparent}
.topbar.scrolled{border-bottom-color:var(--border)}
.topbar h1{font-size:18px;font-weight:650;margin:0 0 0 4px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;height:44px;padding:0 10px;border:0;background:transparent;color:var(--text);border-radius:12px;cursor:pointer;font:inherit;font-size:14px}
.iconbtn:hover{background:var(--hover)}
.iconbtn .ico{width:22px;height:22px}
.drawer{position:fixed;z-index:45;top:0;bottom:0;left:0;width:min(84vw,var(--side));background:var(--surface);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));transform:translateX(-102%);transition:transform .22s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-lg);overflow-y:auto}
body.menu-open .drawer{transform:none}
.scrim{position:fixed;inset:0;z-index:44;background:rgba(10,14,20,.42);opacity:0;pointer-events:none;transition:opacity .2s}
body.menu-open .scrim{opacity:1;pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 14px;font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand img{width:32px;height:32px;border-radius:9px}
nav{display:flex;flex-direction:column;gap:2px}
nav a,nav summary{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;color:var(--text-2);text-decoration:none;font-size:15px;font-weight:500;cursor:pointer;list-style:none}
nav summary::-webkit-details-marker{display:none}
nav a:hover,nav summary:hover{background:var(--hover);color:var(--text)}
nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav summary .chev{margin-left:auto;transition:transform .2s;width:18px;height:18px}
nav details[open] summary .chev{transform:rotate(180deg)}
nav details a{padding-left:20px}
.drawer-foot{margin-top:auto;padding:14px 12px 4px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.drawer-foot .ico{width:16px;height:16px}
main{max-width:1080px;margin:0 auto;padding:12px 16px calc(96px + env(safe-area-inset-bottom))}
main.vin{animation:vin .18s ease-out}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fab{position:fixed;z-index:35;right:max(18px,env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 20px rgba(37,99,235,.35);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s}
.fab:active{transform:scale(.94)} .fab .ico{width:28px;height:28px;stroke-width:2.2}
@media(min-width:1000px){
  .drawer{transform:none;box-shadow:none;border-right:1px solid var(--border);width:var(--side);z-index:25}
  .scrim{display:none} #menuBtn{display:none}
  .topbar,main{margin-left:var(--side)} .topbar{padding-left:20px} main{padding-left:28px;padding-right:28px}
  .fab{right:32px;bottom:32px}
}
@media (prefers-reduced-motion:reduce){main.vin{animation:none}.drawer,.scrim{transition:none}}
/* ---------- Bloques ---------- */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.mcgrid{gap:0 12px;margin-top:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
.mcgrid .wide{grid-column:1/-1}
.mcgrid label.f{margin-bottom:8px}
.rch{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.rtab tr.on td{background:var(--accent-soft)}
.rtab tr.on td:first-child{font-weight:650;color:var(--accent)}
.rlist{margin:6px 0 0;padding-left:18px;font-size:14px;line-height:1.5}
.rlist li{margin:4px 0}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:760px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{position:relative;background:var(--surface);border-radius:var(--radius);padding:16px 18px;min-width:0;box-shadow:var(--shadow)}
.card h2{font-size:16px;margin:0 0 2px;font-weight:650;letter-spacing:-.01em}
.card .sub{font-size:13.5px;color:var(--text-2);margin:0 0 12px}
.stat .lbl{font-size:13px;color:var(--text-2);font-weight:500}
.stat .val{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.stat .note{font-size:12.5px;color:var(--muted);margin-top:2px}
.hero{padding:20px 20px 12px}
.hero .lbl{font-size:14px;color:var(--text-2);font-weight:500}
.hero .big{font-size:38px;font-weight:750;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.15;margin:4px 0 6px}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--text-2)}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--text-2)}
.delta.up{background:var(--good-bg);color:var(--good-text)} .delta.down{background:var(--crit-bg);color:var(--crit-text)}
.pos{color:var(--good-text)} .neg{color:var(--crit-text)}
h3.sec{font-size:13px;letter-spacing:.02em;color:var(--muted);margin:22px 4px 8px;font-weight:600;display:flex;align-items:center;gap:6px}
h3.sec .tot{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--text-2)}
.stack{display:flex;flex-direction:column;gap:12px}
/* ---------- Controles ---------- */
button,.btn{font:inherit;font-size:14px;font-weight:550;border:1px solid var(--border);background:var(--surface);color:var(--text);min-height:40px;padding:8px 16px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .12s,border-color .12s}
button:hover,.btn:hover{background:var(--hover)}
button.pri,.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.pri:hover,.btn.pri:hover{filter:brightness(1.06);background:var(--accent)}
button.dan{color:var(--crit-text)}
button:disabled{opacity:.5;cursor:default}
button.sm,.btn.sm{min-height:34px;padding:5px 12px;font-size:13px;border-radius:10px}
button:focus-visible,a:focus-visible,.btn:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (pointer:coarse){button,.btn{min-height:44px}button.sm,.btn.sm{min-height:38px}}
input,select,textarea{font:inherit;font-size:15px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:9px 12px;width:100%;min-height:42px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox],input[type=radio]{min-height:0;width:auto}
textarea{min-height:90px}
label.f{display:block;font-size:13px;color:var(--text-2);margin-bottom:10px;font-weight:500}
label.f > input,label.f > select{margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > *{flex:1;min-width:130px}
.row > button,.row > .btn{flex:none;min-width:0}
.tabs-inline{display:inline-flex;gap:2px;margin-bottom:14px;flex-wrap:wrap;align-items:center;background:var(--surface-2);padding:3px;border-radius:12px}
.tabs-inline .btn,.tabs-inline button{border:0;background:transparent;min-height:36px;padding:6px 16px;border-radius:10px;color:var(--text-2);font-weight:550}
.tabs-inline .btn.pri,.tabs-inline button.pri{background:var(--surface);color:var(--text);box-shadow:var(--shadow);filter:none}
.tabs-inline .ib.inl{margin:0 6px}
a.btn{text-decoration:none}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:550;font-size:12.5px;border-bottom:1px solid var(--border);padding:8px 6px}
td{border-bottom:1px solid var(--border);padding:8px 6px;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl{overflow-x:auto}
td select{padding:4px 8px;font-size:13px;min-height:34px}
/* ---------- Avisos ---------- */
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:14px;background:var(--surface-2);margin-bottom:8px;font-size:14px}
.alert.good{background:var(--good-bg)} .alert.warn{background:var(--warn-bg)} .alert.crit{background:var(--crit-bg)} .alert.info{background:var(--info-bg)}
.alert .ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff}
.alert.good .ic{background:var(--good)} .alert.warn .ic{background:var(--warn);color:#1a1a19} .alert.crit .ic{background:var(--crit)} .alert.info .ic{background:var(--accent)}
.alert b{font-weight:600}
.alert.act{padding:0 4px 0 14px;align-items:center}
.alert.act .ic{margin:11px 0}
.alert .ab{flex:1;min-width:0;display:flex;align-items:center;gap:8px;justify-content:space-between;text-align:left;border:0;background:transparent;padding:11px 0;font:inherit;font-size:14px;font-weight:400;color:inherit;min-height:44px;border-radius:0;cursor:pointer}
.alert .ab:hover{background:transparent;text-decoration:underline;text-decoration-color:var(--muted)}
.alert .ab .chev{color:var(--muted);width:18px;height:18px;flex:none}
.alert .ax{flex:none;border:0;background:transparent;min-width:40px;min-height:40px;width:40px;padding:0;color:var(--muted);border-radius:10px;align-self:center}
.alert .ax:hover{background:rgba(127,127,127,.14);color:var(--text)}
.alert .ax .ico{width:18px;height:18px}
.txr.unc{background:var(--warn-bg)}
.txr .uncl{color:#9a6700;font-weight:600}
@media (prefers-color-scheme: dark){.txr .uncl{color:var(--warn)}}
.abox{padding:0;overflow:hidden}
.abox > summary{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;list-style:none;font-weight:600}
.abox > summary::-webkit-details-marker{display:none}
.abox > summary .dot{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--good-bg);color:var(--good-text)}
.abox.warn > summary .dot{background:var(--warn-bg);color:#9a6700} .abox.crit > summary .dot{background:var(--crit-bg);color:var(--crit-text)}
.abox > summary .chev{margin-left:auto;color:var(--muted);transition:transform .2s}
.abox[open] > summary .chev{transform:rotate(180deg)}
.abox .abody{padding:0 14px 8px}
.abox > summary .ib{position:static;margin-left:4px}
/* ---------- Listas tipo app de banco ---------- */
.list{padding:4px 0;overflow:hidden}
.lrow{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 16px;border:0;border-radius:0;background:transparent;text-align:left;font-weight:400;color:var(--text);cursor:pointer}
.lrow + .lrow{border-top:1px solid var(--border)}
.lrow:hover{background:var(--hover)}
.lrow .lm{flex:1;min-width:0;display:flex;flex-direction:column}
.lrow .lm b{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .lm span,.lrow .lr span{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .lrow .lr span.neg{color:var(--crit-text);font-weight:600}
.lrow .lr{display:flex;flex-direction:column;align-items:flex-end;text-align:right;font-variant-numeric:tabular-nums;flex:none;max-width:48%}
.lrow .lr b{font-weight:650;font-size:15px}
.lrow .chev{color:var(--muted);width:18px;height:18px}
.av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:14px;font-weight:700;color:#fff;background:hsl(var(--h,215) 62% 52%);letter-spacing:.02em}
.av.round{border-radius:50%}
.av .ico{width:20px;height:20px}
.listbar{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:6px 0 2px}
.listbar select{width:auto;min-height:38px;padding:6px 10px;font-size:14px}
.txday{margin-top:14px}
.txday-h{position:sticky;top:calc(var(--top) + env(safe-area-inset-top));z-index:5;display:flex;justify-content:space-between;gap:10px;padding:8px 6px;font-size:13px;font-weight:600;color:var(--text-2);background:var(--bg)}
.txday-h span:last-child{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500}
.txr .lm span .rec{color:var(--accent)}
.sheet-head{display:flex;align-items:center;gap:12px;margin:0 30px 12px 0}
.sheet-head h2{margin:0}
.sheet-big{font-size:30px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.actgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:14px 0}
.actgrid button{flex-direction:column;min-height:72px;gap:4px;font-size:13px;border-radius:14px}
.actgrid button .ico{width:22px;height:22px}
.choice{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.choice button,.choice .chl{justify-content:flex-start;min-height:64px;padding:10px 14px;text-align:left;gap:12px;font-weight:400}
.choice button b,.choice .chl b{display:block;font-weight:600}
.choice button span.muted,.choice .chl span.muted{display:block}
.choice .chl{position:relative;overflow:hidden;width:100%}
.choice .chl input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;padding:0;border:0}
/* Extractos del mes */
.tbadge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:999px;background:var(--crit-text);color:#fff;font-size:11px;font-weight:700}
.sbar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:8px 0 4px}
.sbar i{display:block;height:100%;background:var(--good-text);border-radius:999px}
.slist{margin:10px -18px 0;border-top:1px solid var(--border)}
.srow{display:flex;align-items:center;gap:12px;padding:10px 18px}
.srow + .srow{border-top:1px solid var(--border)}
.srow .lm{flex:1;min-width:0;display:flex;flex-direction:column}
.srow .lm b{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .lm span{font-size:12.5px;color:var(--muted)}
.srow button{flex:none}
.sst{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px;white-space:nowrap}
.sst .ico{width:13px;height:13px}
.sst.ok{background:var(--good-bg);color:var(--good-text)}
.sst.due{background:var(--warn-bg);color:#8a5a00}
@media (prefers-color-scheme: dark){.sst.due{color:#f5c451}}
button.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
button.ghost:hover{background:var(--hover)}
@media (max-width:420px){.hide-xs{display:none}.srow .sst{display:none}}
.plink{display:flex;align-items:center;gap:10px;margin:10px 0;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:14px}.plink>svg{width:18px;height:18px;flex:none;color:var(--muted)}.plink>span{flex:1;min-width:0}.plink.alert{margin:10px 0}
#dragHint{display:none;position:fixed;inset:12px;z-index:75;border:3px dashed var(--accent);border-radius:20px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(2px);align-items:center;justify-content:center;font-size:20px;font-weight:650;color:var(--text);pointer-events:none}
body.dragging #dragHint{display:flex}
details.card > summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
details.card > summary::-webkit-details-marker{display:none}
details.card > summary::before{content:'›';display:inline-block;transition:transform .15s;font-weight:700;color:var(--muted)}
details.card[open] > summary::before{transform:rotate(90deg)}
.steps{list-style:none;padding:0;margin:4px 0 0}
.steps li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--border)}
.steps li:first-child{border-top:0}
.steps .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;font-size:13px;background:var(--surface-2);color:var(--text-2)}
.steps li.done .n{background:var(--good);color:#fff}
.steps li.done .st{color:var(--muted);text-decoration:line-through}
.steps .st{flex:1;min-width:0}
.prog{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:10px 0 4px}
.prog span{display:block;height:100%;background:var(--good);border-radius:99px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .search{flex:1 1 220px;position:relative}
.toolbar .search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.toolbar .search input{padding-left:38px}
.toolbar select{flex:1 1 140px;width:auto}
.toolbar button{flex:none}
.empty{padding:36px 16px;text-align:center;color:var(--text-2)}
.empty .ei{width:56px;height:56px;border-radius:18px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 12px}
.empty .ei .ico{width:28px;height:28px}
.empty p{margin:0 auto 14px;max-width:420px}
